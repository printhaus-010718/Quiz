<html lang="en">
<head>

<style>
:root{

}

  :root:not([data-theme="light"]){

  }
}
:root[data-theme="dark"]{
  --bg:#0e1633;--bg2:#1a1242;--card:#19234a;--ink:#f1f4ff;--muted:#b3bfe4;--line:#2d3b6e;
  --ok:#5cecb9;--okbg:#0f3a2f;--bad:#ff9db0;--badbg:#4a1a28;--warn:#ffd36b;--warnbg:#4a3a0c;
  --shadow:0 6px 0 rgba(0,0,0,.35),0 14px 28px rgba(0,0,0,.3);color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);background:linear-gradient(160deg,var(--bg),var(--bg2));
  font-family:"Fredoka","Trebuchet MS",system-ui,"Segoe UI",Roboto,sans-serif;font-size:18px;line-height:1.45}
h1,h2,h3{margin:.2em 0 .4em;line-height:1.15}
h1{font-size:clamp(1.8rem,5vw,2.8rem)} h2{font-size:1.4rem} h3{font-size:1.15rem}
p{margin:.4em 0}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 60px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.small{font-size:.9rem;color:var(--muted)}
:focus-visible{outline:4px solid var(--yellow);outline-offset:2px;box-shadow:0 0 0 7px var(--onbright)}
button,input,select,textarea{font:inherit;color:inherit}
.btn{min-height:56px;border:0;border-radius:20px;padding:12px 22px;font-weight:600;font-size:1.1rem;cursor:pointer;color:#fff;
  background:var(--blue);box-shadow:0 5px 0 rgba(0,0,0,.22);transition:transform .1s,box-shadow .1s;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.btn.purple{background:var(--purple)} .btn.coral{background:var(--coral)}
.btn.mint{background:var(--mint);color:var(--onbright)} .btn.yellow{background:var(--yellow);color:var(--onbright)}
.btn.ghost{background:var(--card);color:var(--ink);border:3px solid var(--line);box-shadow:none}
.btn.sm{min-height:48px;padding:8px 16px;font-size:1rem;border-radius:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border-radius:26px;padding:18px 20px;box-shadow:var(--shadow);margin:16px 0}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.row.center{justify-content:center}
.grid{display:grid;gap:14px}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:.9rem;font-weight:600;background:var(--line);color:var(--ink)}
.chip.lv-easy{background:var(--mint);color:var(--onbright)} .chip.lv-hard{background:var(--yellow);color:var(--onbright)}
.chip.lv-advanced{background:var(--purple);color:#fff}
input[type=text],select,textarea{width:100%;min-height:52px;border-radius:16px;border:3px solid var(--line);background:var(--card);padding:10px 14px}
label{font-weight:600;display:block;margin:8px 0 4px}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:6px}
.mascot{width:150px;flex:none}
.bubble{flex:1;min-width:240px;background:var(--card);border-radius:28px;padding:16px 22px;box-shadow:var(--shadow);position:relative}
.robot{width:100%;height:auto;animation:bob 3s ease-in-out infinite}
.robot .mouth{transform-origin:60px 63px}
.speaking .robot .mouth{animation:talk .28s ease-in-out infinite alternate}
.listening .robot .ear{fill:var(--yellow);animation:pulse 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes talk{to{transform:scaleY(2.6)}}
@keyframes pulse{50%{opacity:.45}}
.levels button{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;background:var(--card);border:4px solid var(--line);border-radius:24px;padding:14px 16px;box-shadow:var(--shadow);min-height:56px}
.levels button[aria-checked=true]{border-color:var(--blue);background:var(--card);outline:3px solid var(--yellow)}
.levels .tick{float:right;font-weight:700;color:var(--ok)}
.levels b{font-size:1.2rem}
.tiles .btn{flex:1 1 200px}
.banner{border-radius:18px;padding:10px 16px;margin:10px 0;font-weight:500}
.banner.warn{background:var(--warnbg);color:var(--warn)} .banner.bad{background:var(--badbg);color:var(--bad)} .banner.ok{background:var(--okbg);color:var(--ok)}

.qtop{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar{height:16px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 2px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--blue));border-radius:99px;transition:width .4s}
.stage{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start}
.qcard{background:var(--card);border-radius:26px;padding:18px 20px;box-shadow:var(--shadow);position:relative;min-height:170px}
.qcard h2{font-size:clamp(1.3rem,3.6vw,2rem);margin-right:96px}
.hostsay{background:var(--card);border-radius:20px;padding:10px 14px;margin-top:8px;font-size:.95rem;color:var(--muted);box-shadow:var(--shadow)}
.timer{position:absolute;right:14px;top:14px;width:84px;height:84px}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:9}
.timer .bg{stroke:var(--line)} .timer .fg{stroke:var(--blue);stroke-linecap:round;stroke-dasharray:283;transition:stroke-dashoffset .12s linear}
.timer.low .fg{stroke:var(--coral)}
.timer span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:1.5rem}
.micarea{text-align:center;margin-top:12px}
.mic{width:120px;height:120px;border-radius:50%;border:0;background:var(--purple);color:#fff;font-size:3rem;cursor:pointer;box-shadow:0 8px 0 rgba(0,0,0,.22);position:relative}
.mic.listening{background:var(--coral);animation:ring 1.2s ease-out infinite}
.mic.busy{background:var(--muted);cursor:default}
@keyframes ring{0%{box-shadow:0 8px 0 rgba(0,0,0,.22),0 0 0 0 rgba(232,83,47,.55)}100%{box-shadow:0 8px 0 rgba(0,0,0,.22),0 0 0 28px rgba(232,83,47,0)}}
.miclabel{font-weight:600;font-size:1.2rem;margin-top:8px;min-height:1.6em}
.heard{min-height:1.6em;color:var(--muted);font-style:italic}
.fb{border-radius:24px;padding:16px 20px;margin:14px 0;font-weight:500;display:flex;gap:14px;align-items:flex-start}
.fb.ok{background:var(--okbg);color:var(--ok)} .fb.bad{background:var(--badbg);color:var(--bad)} .fb.time{background:var(--warnbg);color:var(--warn)}
.fb .ic{font-size:2rem;line-height:1} .fb b{display:block;font-size:1.25rem}
.fb .ans{color:var(--ink);font-weight:500}
.pop{animation:pop .5s ease}
@keyframes pop{40%{transform:scale(1.18)}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.typebox{display:flex;gap:10px;max-width:560px;margin:10px auto 0}
.typebox input{flex:1}
.stat{background:var(--card);border-radius:22px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:2rem}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.badge{background:var(--card);border-radius:22px;padding:12px;text-align:center;border:3px solid var(--line)}
.badge.on{border-color:var(--yellow)} .badge.off{opacity:.55}
.badge .em{font-size:2.4rem}
.tbar{height:14px;border-radius:99px;background:var(--line);overflow:hidden} .tbar>i{display:block;height:100%;background:var(--mint)}
.item{border-left:8px solid var(--line);padding:10px 14px;margin:12px 0;background:var(--card);border-radius:0 20px 20px 0;box-shadow:var(--shadow)}
.item.ok{border-color:var(--ok)} .item.bad{border-color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:.95rem} td,th{padding:8px 6px;border-bottom:2px solid var(--line);text-align:left}
input[type=range]{width:100%;height:36px}
.switch{display:flex;align-items:center;gap:12px;min-height:48px}
.switch input{width:28px;height:28px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (max-width:640px){
  .stage{grid-template-columns:1fr}.stage .host{display:flex;gap:12px;align-items:center}.stage .host .mascot{width:90px}.stage .hostsay{flex:1;margin:0}
  .mascot{width:110px} .mic{width:104px;height:104px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

const NUMW={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19};
const TENW={twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};
const NEG=new Set(["not","never","dont","doesnt","isnt","cant","wont","didnt","arent","wasnt","cannot"]);
function stemWord(w){
  if(w.length<=3||w.indexOf("*")>=0||/\d/.test(w))return w;
  if(/ies$/.test(w))return w.slice(0,-3)+"y";
  if(/(ses|xes|ches|shes|zes)$/.test(w))return w.slice(0,-2);
  if(/[^s]s$/.test(w))return w.slice(0,-1);
  return w;
}
function normText(s,isKey){
  s=String(s).toLowerCase().replace(/[’'`]/g,"").replace(/°/g," degrees ").replace(/[–—-]/g," ");
  s=s.replace(isKey?/[^a-z0-9.\/*| ]/g:/[^a-z0-9.\/ ]/g," ");
  s=s.replace(/\.(?!\d)|(?<!\d)\./g," ").replace(/\/(?!\d)|(?<!\d)\//g," ");
  return s.replace(/\s+/g," ").trim();
}
function numberize(tk){
  const out=[];let i=0;
  const isN=w=>w in NUMW||w in TENW||w==="hundred";
  while(i<tk.length){
    if(!isN(tk[i])){out.push(tk[i]);i++;continue;}
    let cur=0,j=i;
    while(j<tk.length){
      const w=tk[j];
      if(w in NUMW)cur+=NUMW[w];else if(w in TENW)cur+=TENW[w];else if(w==="hundred")cur=(cur||1)*100;
      else if(w==="and"&&j>i&&j+1<tk.length&&isN(tk[j+1])){j++;continue;}
      else break;
      j++;
    }
    let str=String(cur);
    if(tk[j]==="point"&&j+1<tk.length&&(tk[j+1] in NUMW&&NUMW[tk[j+1]]<10||/^\d$/.test(tk[j+1]))){
      let dec="";j++;
      while(j<tk.length&&((tk[j] in NUMW&&NUMW[tk[j]]<10)||/^\d$/.test(tk[j]))){dec+=(tk[j] in NUMW?NUMW[tk[j]]:tk[j]);j++;}
      str+="."+dec;
    }
    out.push(str);i=j;
  }
  return out;
}
function toks(s,isKey){
  const t=normText(s,isKey).split(" ").filter(Boolean);
  return numberize(t).map(stemWord);
}
function lev(a,b){
  if(a===b)return 0;const m=a.length,n=b.length;if(!m||!n)return Math.max(m,n);
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++){cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));}prev=cur;}
  return prev[n];
}
function tokMatch(p,t){
  if(p.endsWith("*")){const pre=p.slice(0,-1);return t.startsWith(pre);}
  if(p===t)return true;
  if(p.length>=6&&!/\d/.test(p)&&!/\d/.test(t)){return lev(p,t)<=(p.length>=10?2:1);}
  return false;
}
function phraseIn(T,alt){
  const P=toks(alt,true);if(!P.length)return false;
  for(let i=0;i+P.length<=T.length;i++){let ok=true;for(let j=0;j<P.length;j++){if(!tokMatch(P[j],T[i+j])){ok=false;break;}}if(ok)return true;}
  return false;
}
function anyAlt(T,altStr){return altStr.split("|").some(a=>a.trim()&&phraseIn(T,a));}
const IDK=/\b(i )?(dont|do not) know\b|\bnot sure\b|\bno idea\b|\bidk\b|\bi give up\b/;
function evalOne(q,text){
  const raw=normText(text);
  if(!raw)return "unsure";
  if(IDK.test(raw))return "idk";
  const T=toks(text);
  if(!T.length)return "unsure";
  if(!q.neg&&T.some(t=>NEG.has(t)))return "wrong";
  if(q.bad&&q.bad.some(p=>phraseIn(T,p)))return "wrong";
  if(q.count){
    const n=q.k[0].filter(c=>anyAlt(T,c)).length;
    return n>=q.count?"correct":n>0?"partial":"wrong";
  }
  const hits=q.k.filter(g=>g.some(a=>anyAlt(T,a))).length;
  const need=q.need||q.k.length;
  return hits>=need?"correct":hits>0?"partial":"wrong";
}
function judge(q,alts){
  const list=alts.slice(0,2);
  const rs=list.map(a=>evalOne(q,a));
  if(rs.includes("correct"))return "correct";
  return rs[0];
}
function parseCommand(text){
  const n=normText(text);
  if(/^(please )?(repeat|replay|again|say (it|that) again)( the)?( question)?( please)?$/.test(n))return "repeat";
  if(/^(next|next question|go next|move on)( please)?$/.test(n))return "next";
  if(/^(skip|skip (this )?question|pass)( please)?$/.test(n))return "skip";
  if(/^(stop|end|quit|exit)( the)? quiz$|^quit$|^exit$/.test(n))return "stop";
  if(/^((what is|whats|what s|tell me) )?(my )?score( please)?$/.test(n))return "score";
  if(/^(hint|give me a hint|can i have a hint|i need a hint)( please)?$/.test(n))return "hint";
  return null;
}
function speakable(t){
  return String(t).replace(/★/g,"").replace(/_{2,}/g," blank ").replace(/°C/g," degrees Celsius").replace(/(\d+)\s*mL\b/g,"$1 milliliters")
    .replace(/(\d+(?:\.\d+)?)\s*km\/h/g,"$1 kilometers per hour").replace(/(\d+(?:\.\d+)?)\s*cm\b/g,"$1 centimeters").replace(/(\d+)\s*Wh\b/g,"$1 watt hours")
    .replace(/Newton \(N\)/g,"Newton").replace(/(\d+)\s*N\b/g,"$1 newtons").replace(/—|–/g,", ").replace(/\s+/g," ").trim();
}

const ttsOK="speechSynthesis" in window&&"SpeechSynthesisUtterance" in window;
let voiceCache=null,speakFin=null,speakTimer=null;
function pickVoice(){
  if(!ttsOK)return null;
  const vs=speechSynthesis.getVoices();if(!vs.length)return voiceCache;
  const en=vs.filter(v=>/^en(-|_)/i.test(v.lang)||/^en$/i.test(v.lang));
  const pref=["Google US English","Samantha","Microsoft Aria","Microsoft Jenny","Microsoft Zira","Karen","Moira","Google UK English Female"];
  for(const p of pref){const v=en.find(x=>x.name.indexOf(p)>=0);if(v){voiceCache=v;return v;}}
  voiceCache=en.find(v=>/US/i.test(v.lang))||en[0]||null;return voiceCache;
}
if(ttsOK){try{speechSynthesis.onvoiceschanged=()=>{voiceCache=null;pickVoice();};}catch(e){}}
function cancelSpeech(){
  if(speakFin){const f=speakFin;speakFin=null;try{speechSynthesis.cancel();}catch(e){}f();}
  else if(ttsOK){try{speechSynthesis.cancel();}catch(e){}}
}
function speak(text){
  return new Promise(res=>{
    cancelSpeech();
    text=speakable(text);
    if(settings.mute||!ttsOK||!text){res();return;}
    const u=new SpeechSynthesisUtterance(text);
    u.rate=settings.rate;u.volume=settings.volume;u.pitch=1.12;u.lang="en-US";
    const v=pickVoice();if(v)u.voice=v;
    let done=false;
    const fin=()=>{if(done)return;done=true;clearTimeout(speakTimer);if(speakFin===fin)speakFin=null;res();};
    u.onend=fin;u.onerror=fin;speakFin=fin;
    speakTimer=setTimeout(fin,Math.max(4000,text.length*90/Math.max(.5,settings.rate)+2500));
    try{speechSynthesis.speak(u);}catch(e){fin();}
  });
}

      let interim="",fin=null;
      for(let i=e.resultIndex;i<e.results.length;i++){
        const res=e.results[i];
        if(res.isFinal){fin=[];for(let j=0;j<res.length;j++){const t=(res[j].transcript||"").trim();if(t)fin.push(t);}}
        else interim+=res[0].transcript;
      }
      if(fin&&fin.length){got=true;cb.final(fin);}else if(interim)cb.interim(interim.trim());
    };
    r.onerror=e=>{if(gen!==this.gen)return;err=e.error;cb.error(e.error);};
    r.onend=()=>{if(gen!==this.gen)return;cb.end(got,err);};
    this.rec=r;
    try{r.start();}catch(e){cb.error("start-failed");}
  },
  stop(){
    this.gen++;const r=this.rec;this.rec=null;
    if(r){r.onresult=r.onerror=r.onend=null;try{r.abort();}catch(e){}}
  }
};
function micErrorText(code){
  switch(code){
    case"not-allowed":case"service-not-allowed":return"The microphone is blocked. Click the lock or microphone icon in the address bar, allow the microphone, then tap the mic button. You can also type your answer.";
    case"audio-capture":return"I can’t find a working microphone. Check that one is plugged in, or type your answer.";
    case"network":return"The browser’s speech service can’t be reached (it needs an internet connection). You can type your answer instead.";
    case"unsupported":return"This browser can’t turn speech into text. Use Google Chrome or Microsoft Edge for voice answers, or type your answers.";
    case"language-not-supported":return"English speech recognition isn’t available in this browser. You can type your answers.";
    default:return"The microphone had a problem ("+code+"). Try the mic button again or type your answer.";
  }
}

/* ===================== Timer ===================== */
const Timer={id:null,rem:0,tot:0,endAt:0,onTick:null,onEnd:null,
  start(ms,onTick,onEnd){this.clear();this.tot=this.rem=ms;this.onTick=onTick;this.onEnd=onEnd;this.run();},
  run(){this.endAt=Date.now()+this.rem;clearInterval(this.id);this.id=setInterval(()=>{
    this.rem=Math.max(0,this.endAt-Date.now());if(this.onTick)this.onTick(this.rem,this.tot);
    if(this.rem<=0){const f=this.onEnd;this.clear();if(f)f();}},100);},
  pause(){if(this.id){clearInterval(this.id);this.id=null;this.rem=Math.max(0,this.endAt-Date.now());}},
  resume(){if(!this.id&&this.rem>0&&this.onEnd)this.run();},
  clear(){clearInterval(this.id);this.id=null;this.onEnd=null;this.onTick=null;this.rem=0;this.tot=0;}
};

function awardBadges(s){
  const got=[];const give=id=>{if(!stats.badges[id]){stats.badges[id]=Date.now();got.push(id);}};
  const lv=s.level;
  if(s.scored>=3){
    if(lv==="easy"||lv==="all")give("little");
    if(lv==="hard"||lv==="all")give("explorer");
    if(lv==="advanced"||lv==="all")give("genius");
  }
  if(s.scored>=5&&s.correct===s.scored)give("perfect");
  if(s.mode==="competition"&&s.scored>=10&&s.correct/s.scored>=0.8)give("champion");
  if(["little","explorer","genius","perfect","champion"].every(b=>stats.badges[b]))give("master");
  return got;
}

/* ===================== Quiz engine ===================== */
function buildQuestions(mode,level,n){
  let pool=allQuestions();
  if(mode==="mistakes"){pool=pool.filter(q=>stats.missed[q.id]);return shuffle(pool).slice(0,n);}
  pool=pool.filter(q=>inFilter(q,settings.filter));
  if(level==="all"){
    const per=Math.ceil(n/3);let out=[];
    for(const lv of ["easy","hard","advanced"])out=out.concat(shuffle(pool.filter(q=>q.level===lv)).slice(0,per));
    return out;
  }
  return shuffle(pool.filter(q=>q.level===level)).slice(0,n);
}
function startQuiz(mode){
  if(!settings.name.trim())settings.name="Scientist";
  const qs=buildQuestions(mode,settings.level,settings.numQ);
  if(!qs.length){toastMsg=mode==="mistakes"?"You have no missed questions to practice yet. Play a quiz first!":"No questions match that level and topic. Try “All topics” or a different level.";go("home");return;}
  cleanup();
  quiz={mode,level:settings.level,qs,i:-1,score:0,correct:0,wrong:0,answers:[],state:"IDLE",dead:false,timeouts:[],
    micOn:false,micStatus:micOK?"idle":"unsupported",typed:!micOK,micMsg:micOK?"":micErrorText("unsupported"),lastLevel:null,heard:"",interim:"",hostText:"",q:null,fb:null,unsure:0,trouble:false,
    timed:false,names:null};
  view="quiz";render();askQuestion();
}
const alive=me=>quiz===me&&!me.dead;
function wait(me,ms){return new Promise(r=>{const id=setTimeout(r,ms);me.timeouts.push(id);});}
function setState(s){if(quiz){quiz.state=s;live(STATE_LABEL[s]||"");}}
async function askQuestion(){
  const me=quiz;if(!alive(me))return;
  me.i++;
  if(me.i>=me.qs.length){finish();return;}
  const q=me.qs[me.i];me.q=q;
  Object.assign(me,{heard:"",interim:"",fb:null,fbKey:"",waitNext:false,retrying:false,partialUsed:false,unsure:0,trouble:false,micOn:false,typed:me.typed&&me.micStatus!=="idle"&&me.micStatus!=="ok"?true:!micOK,hostText:""});
  const L=LEVELS[q.level];
  me.timed=(me.mode==="practice"||me.mode==="mistakes")?settings.timerPractice:settings.timerComp;
  me.timeTotal=L.secs*1000;me.timeLeft=me.timeTotal;
  Timer.clear();
  setState("SPEAKING");
  let intro="";
  if(me.i===0)intro+="Hello "+settings.name+"! Welcome to Science Wonder Quiz Bee! ";
  if(q.level!==me.lastLevel){intro+=L.name+" round: "+L.title+"! ";me.lastLevel=q.level;}
  const text=intro+"Question number "+ordWord(me.i+1)+"! "+speakable(q.q);
  me.hostText="Question "+(me.i+1)+"! "+speakable(q.q);
  ui();
  await speak(text);if(!alive(me))return;
  await wait(me,450);if(!alive(me))return;
  beginAnswering(me,true);
}
function beginAnswering(me,fresh){
  if(!alive(me))return;
  if(fresh&&me.timed){
    Timer.start(me.timeTotal,()=>ui(),()=>timeUp(me));
  }else if(me.timed){Timer.resume();}
  startListen(me);
}
function startListen(me){
  if(!alive(me))return;
  setState("LISTENING");me.interim="";
  if(!micOK||me.micStatus==="denied"||me.micStatus==="nomic"||me.micStatus==="network"){me.micOn=false;me.typed=true;ui();return;}
  if(!settings.autoListen&&!me.userTapped){me.micOn=false;ui();return;}
  me.micOn=true;me.emptyRounds=me.emptyRounds||0;ui();
  Mic.start({
    interim:t=>{if(alive(me)&&me.state==="LISTENING"){me.interim=t;ui();}},
    final:alts=>{if(alive(me)&&me.state==="LISTENING")onHeard(me,alts);},
    error:code=>{
      if(!alive(me))return;
      if(code==="no-speech"||code==="aborted")return;
      me.micOn=false;me.typed=true;
      if(code==="not-allowed"||code==="service-not-allowed")me.micStatus="denied";
      else if(code==="audio-capture")me.micStatus="nomic";
      else if(code==="network"||code==="unsupported"||code==="language-not-supported")me.micStatus="network";
      me.micMsg=micErrorText(code);ui();
    },
    end:(got,err)=>{
      if(!alive(me)||me.state!=="LISTENING"||got||!me.micOn)return;
      if(err&&err!=="no-speech"&&err!=="aborted")return;
      me.emptyRounds++;
      if(!me.timed&&me.emptyRounds>=4){me.micOn=false;me.emptyRounds=0;ui();return;}
      wait(me,250).then(()=>{if(alive(me)&&me.state==="LISTENING"&&me.micOn)startListen(me);});
    }
  });
  me.micStatus=me.micStatus==="idle"?"ok":me.micStatus;
}
function stopListening(me){Mic.stop();if(me)me.micOn=false;}
function onHeard(me,alts){
  stopListening(me);me.heard=alts[0];me.interim="";me.emptyRounds=0;
  const cmd=parseCommand(alts[0]);
  if(cmd){runCommand(me,cmd);return;}
  submit(me,alts,"voice");
}
function submit(me,alts,src){
  if(!alive(me)||me.state==="FEEDBACK"||me.state==="PROCESSING")return;
  stopListening(me);Timer.pause();
  me.heard=alts[0];me.src=src;setState("PROCESSING");ui();
  const q=me.q;let res=judge(q,alts);
  if(me.retrying){feedback(me,res==="correct"?"correct":"wrong");return;}
  if(res==="idk"&&me.mode==="competition")res="wrong";
  if(res==="unsure"||res==="idk"){reprompt(me,res);return;}
  if(res==="partial"&&(me.mode==="practice"||me.mode==="mistakes")&&!me.partialUsed){me.partialUsed=true;reprompt(me,"partial");return;}
  feedback(me,res==="correct"?"correct":"wrong");
}
async function reprompt(me,kind){
  let msg;
  if(kind==="partial")msg="You’re on the right track! Can you say the whole answer?";
  else if(kind==="idk")msg="That’s okay! Say hint for a clue, or try your best guess!";
  else{me.unsure++;me.trouble=true;msg=me.unsure>=2?"I’m having trouble hearing you. Tap the microphone, or type your answer.":"Hmm, I didn’t catch that. Please say your answer again!";if(me.unsure>=2)me.typed=true;}
  me.hostText=msg;me.heard=kind==="unsure"?"":me.heard;setState("SPEAKING");ui();
  await speak(msg);if(!alive(me))return;
  await wait(me,300);if(!alive(me))return;
  me.heard="";me.userTapped=true;beginAnswering(me,false);
}
async function runCommand(me,cmd){
  Timer.pause();setState("PROCESSING");ui();
  const prac=me.mode==="practice"||me.mode==="mistakes";
  if(cmd==="repeat"){await replay(me);return;}
  if(cmd==="score"){
    const n=me.answers.filter(a=>!a.unscored).length;
    const msg="You have "+me.score+" point"+(me.score===1?"":"s")+". You got "+me.correct+" of "+n+" questions right so far.";
    me.hostText=msg;setState("SPEAKING");ui();await speak(msg);if(!alive(me))return;await wait(me,300);if(!alive(me))return;me.heard="";beginAnswering(me,false);return;
  }
  if(cmd==="hint"){if(prac){await giveHint(me);}else{me.hostText="No hints in the competition!";setState("SPEAKING");ui();await speak(me.hostText);if(!alive(me))return;me.heard="";beginAnswering(me,false);}return;}
  if(cmd==="stop"){me.heard="";endEarly(me);return;}
  if(cmd==="next"||cmd==="skip"){skip(me);return;}
}
async function replay(me){
  if(!alive(me))return;
  stopListening(me);Timer.pause();setState("SPEAKING");me.heard="";me.hostText=speakable(me.q.q);ui();
  await speak(me.q.q);if(!alive(me))return;
  await wait(me,350);if(!alive(me))return;
  me.userTapped=true;beginAnswering(me,false);
}
function hintFor(q){
  const w=q.a.replace(/[^A-Za-z0-9 ]/g," ").trim().split(/\s+/);
  if(w.length<=3&&/[A-Za-z]/.test(w[0]))return "Here’s a hint. The answer starts with the letter "+w[0][0].toUpperCase()+".";
  if(/^\d/.test(q.a))return "Here’s a hint. Look closely at the numbers in the problem and do the math step by step.";
  return "Here’s a hint. Think about "+topicName(q.t)+".";
}
async function giveHint(me){
  stopListening(me);Timer.pause();setState("SPEAKING");const h=hintFor(me.q);me.hostText=h;me.heard="";ui();
  await speak(h);if(!alive(me))return;await wait(me,300);if(!alive(me))return;me.userTapped=true;beginAnswering(me,false);
}
function skip(me){
  if(!alive(me))return;stopListening(me);Timer.pause();me.heard=me.heard||"";feedback(me,"skipped");
}
function timeUp(me){
  if(!alive(me)||me.state==="FEEDBACK")return;
  stopListening(me);cancelSpeech();feedback(me,"timeout");
}
async function feedback(me,kind){
  if(!alive(me))return;
  stopListening(me);Timer.clear();
  const q=me.q,L=LEVELS[q.level];
  const ok=kind==="correct";
  const unscored=kind==="timeout"&&(me.trouble||me.micStatus==="denied"||me.micStatus==="nomic");
  setState("FEEDBACK");
  let spoken,msg="";
  if(ok){
    if(!me.retrying){me.score+=L.pts;me.correct++;}
    const long=q.a.split(/\s+/).length>5;
    msg=me.retrying?" Nice job trying again!":" You earned "+L.pts+" point"+(L.pts>1?"s":"")+"!";
    spoken=praise()+" "+(me.retrying?"That’s it!":(q.a.split(/\s+/).length<=4?q.a.replace(/\.$/,"")+" is correct! ":"")+"You earned "+L.pts+" point"+(L.pts>1?"s":"")+"!")+((me.mode==="practice"||me.mode==="mistakes")&&long?" Here’s the explanation: "+q.a:"");
    sfx.ok();
  }else if(kind==="timeout"){
    spoken="Time is up! Let’s find out the correct answer. "+q.a;sfx.bad();
  }else if(kind==="skipped"){
    spoken="Okay, let’s skip that one! The correct answer is "+q.a;
  }else{
    spoken=tryAgain()+" The correct answer is "+q.a+((me.mode==="practice"||me.mode==="mistakes")?" Want to try again?":"");sfx.bad();
  }
  if(!me.retrying){
    if(!ok&&!unscored)me.wrong++;
    me.answers.push({id:q.id,q:q.q,a:q.a,t:q.t,level:q.level,said:me.heard||"",src:me.src||"voice",res:kind,unscored});
  }
  me.fb={kind,msg};me.fbKey=me.i+":"+kind+":"+(me.retrying?"r":"f")+":"+Date.now();me.hostText=ok?spoken:spoken;
  const prac=me.mode==="practice"||me.mode==="mistakes";
  me.waitNext=prac;
  live((ok?"Correct. ":"Not quite. ")+"The answer is "+q.a);
  ui();
  await speak(spoken);if(!alive(me))return;
  if(prac){me.hostText="Press Next question when you’re ready.";ui();return;}
  await wait(me,ok?600:900);if(!alive(me))return;
  askQuestion();
}
function retryQuestion(){
  const me=quiz;if(!me||!me.waitNext)return;
  me.retrying=true;me.waitNext=false;me.fb=null;me.fbKey="";me.heard="";me.userTapped=true;
  me.hostText="Try again! "+speakable(me.q.q);setState("LISTENING");ui();
  beginAnswering(me,false);
}
function endEarly(me){
  if(!alive(me))return;
  cancelSpeech();Timer.clear();stopListening(me);
  if(!me.answers.length){go("home");return;}
  finish(true);
}
function finish(early){
  const me=quiz;if(!me)return;
  Timer.clear();Mic.stop();cancelSpeech();
  const scored=me.answers.filter(a=>!a.unscored);
  const correct=scored.filter(a=>a.res==="correct").length;
  const pct=scored.length?correct/scored.length:0;
  const name=settings.name;
  let tail=pct>=.9?" You are a true Science Champion!":pct>=.7?" Great job, scientist!":pct>=.4?" Nice work! Keep practicing and you will be a champion.":" Every scientist learns by trying. Let’s practice the ones you missed!";
  const message=(early?"You stopped early, "+name+". ":"Congratulations "+name+"! You completed the Science Quiz Bee and ")+(early?"You answered ":"answered ")+correct+" out of "+scored.length+" question"+(scored.length===1?"":"s")+" correctly!"+tail;
  const session={date:Date.now(),name,mode:me.mode,level:me.level,points:me.score,correct,scored:scored.length,answers:me.answers,message};
  // stats
  scored.forEach(a=>{
    const t=stats.topics[a.t]||(stats.topics[a.t]={c:0,t:0});t.t++;if(a.res==="correct")t.c++;
    if(a.res==="correct")delete stats.missed[a.id];else stats.missed[a.id]=(stats.missed[a.id]||0)+1;
  });
  session.newBadges=awardBadges(session);
  const keep=Object.assign({},session,{answers:session.answers.map(a=>({id:a.id,t:a.t,level:a.level,res:a.res,said:a.said}))});
  stats.sessions.unshift(keep);stats.sessions=stats.sessions.slice(0,50);saveStats();
  lastSession=session;
  quiz.dead=true;quiz=null;view="results";render();window.scrollTo(0,0);
  sfx.win();
  speak(message);
}

let confettiRAF=null;
function startConfetti(){
  const c=$("#confetti");if(!c)return;
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const ctx=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=["#3b6cf6","#7c4dff","#27d3a2","#ffc533","#e8532f"];
  const ps=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.6,r:4+Math.random()*6,c:cols[rnd(cols.length)],vy:2+Math.random()*3.5,vx:-1.5+Math.random()*3,rot:Math.random()*6}));
  const end=Date.now()+3500;cancelAnimationFrame(confettiRAF);
  (function f(){
    ctx.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.rot+=.1;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore();});
    if(Date.now()<end&&view==="results")confettiRAF=requestAnimationFrame(f);else ctx.clearRect(0,0,c.width,c.height);
  })();
}

function mtRefresh(){if(view==="mictest"){app.innerHTML=micTestView();}}
function micTestStart(){
  mtState.error=null;mtState.ok=false;mtState.heard="";mtState.listening=true;mtState.status="Listening… say “hello science”.";
  cancelSpeech();mtRefresh();
  Mic.start({
    interim:t=>{mtState.heard=t;const e=$("#mtHeard");if(e)e.textContent="I heard: “"+t+"”";},
    final:alts=>{Mic.stop();mtState.listening=false;mtState.heard=alts[0];mtState.ok=true;mtState.status="Great! I heard you.";micTestedThisVisit=true;mtRefresh();speak("I heard you say "+alts[0]);},
    error:code=>{if(code==="no-speech"||code==="aborted")return;Mic.stop();mtState.listening=false;mtState.error=code;mtState.status="";mtRefresh();},
    end:(got,err)=>{if(!got&&!err&&mtState.listening){mtState.listening=false;mtState.status="I didn’t hear anything. Press the button and try again.";mtRefresh();}}
  });
}

/* ===================== Events ===================== */
app.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.tagName==="SELECT"||b.type==="range"||b.type==="checkbox")return;
  act(b.dataset.act,b);
});
app.addEventListener("change",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  if(b.dataset.act==="filter"){settings.filter=b.value;saveSettings();return;}
  if(b.dataset.act==="set"){
    const k=b.dataset.k;let v=b.type==="checkbox"?b.checked:b.type==="range"?parseFloat(b.value):(["numQ"].includes(k)?parseInt(b.value,10):b.value);
    settings[k]=v;saveSettings();
  }
});
app.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="nm"){settings.name=t.value.trim().slice(0,20);saveSettings();}
  if(t.dataset&&t.dataset.act==="set"&&t.type==="range"){
    const k=t.dataset.k;settings[k]=parseFloat(t.value);saveSettings();
    const vv=$("#vVal"),rv=$("#rVal");if(vv)vv.textContent=Math.round(settings.volume*100)+"%";if(rv)rv.textContent=settings.rate.toFixed(2)+"×";
  }
});
app.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id==="typeIn"){e.preventDefault();typedSubmit();}
});
function typedSubmit(){
  const me=quiz;if(!me)return;const el=$("#typeIn");const v=el?el.value.trim():"";if(!v)return;
  if(me.state!=="LISTENING")return;
  el.value="";const cmd=parseCommand(v);
  if(cmd&&cmd!=="hint"){runCommand(me,cmd);return;}
  submit(me,[v],"typed");
}
function act(a,b){
  const me=quiz;
  switch(a){
    case"home":go("home");break;
    case"level":settings.level=b.dataset.v;saveSettings();render();break;
    case"hello":speak("Welcome to Science Wonder Quiz Bee! Are you ready to become a Science Champion?");{const m=$("#homeMascot");if(m)m.className="mascot speaking";setTimeout(()=>{const x=$("#homeMascot");if(x)x.className="mascot";},3500);}break;
    case"start":{
      const mode=b.dataset.v;
      if(micOK&&settings.autoListen&&!micTestedThisVisit&&mode!=="practice"&&view!=="review"){pendingStart=mode;go("mictest");break;}
      startQuiz(mode);break;}
    case"mictest":pendingStart=null;go("mictest");break;
    case"mt-voice":speak("Hello! I am your science quiz host. Can you hear me?");break;
    case"mt-mic":if(mtState.listening){Mic.stop();mtState.listening=false;mtState.status="Stopped.";mtRefresh();}else micTestStart();break;
    case"mt-go":{const m=pendingStart;pendingStart=null;micTestedThisVisit=true;Mic.stop();startQuiz(m);break;}
    case"progress":go("progress");break;
    case"sound":go("sound");break;
    case"parent":go("parent");syncParentSelects();break;
    case"test-voice":speak("Hi! I am your science quiz host. This is how I sound.");break;
    case"results":go("results");break;
    case"review":go("review");break;
    case"again":startQuiz(lastSession?lastSession.mode:"practice");break;
    case"replay-item":{const it=lastSession.answers[+b.dataset.v];speak(it.q+" The correct answer is "+it.a);break;}
    case"add-custom":{
      const q=$("#c-q").value.trim(),k=$("#c-k").value.trim(),ans=$("#c-a").value.trim()||$("#c-k").value.split(",")[0].trim();
      const msg=$("#c-msg");
      if(!q||!k){msg.textContent="Please fill in the question and at least one accepted answer.";break;}
      const alts=k.split(",").map(s=>s.trim()).filter(Boolean);
      custom.push({id:"c"+Date.now(),level:$("#c-l").value,t:$("#c-t").value,q,a:ans,accept:alts.join(", "),k:[alts.map(s=>s.replace(/\|/g," "))],custom:true});
      store.set("custom",custom);go("parent");syncParentSelects();break;}
    case"del-custom":custom.splice(+b.dataset.v,1);store.set("custom",custom);go("parent");syncParentSelects();break;
    case"reset":
      if(b.dataset.armed){stats={sessions:[],missed:{},topics:{},badges:{}};saveStats();go("parent");syncParentSelects();}
      else{b.dataset.armed="1";b.textContent="Tap again to erase everything";setTimeout(()=>{if(b&&b.isConnected){delete b.dataset.armed;b.textContent="Erase all progress";}},4000);}
      break;
    /* quiz */
    case"q-exit":
      if(b.dataset.armed){go("home");}
      else{b.dataset.armed="1";b.textContent="Tap again to exit";setTimeout(()=>{if(b&&b.isConnected){delete b.dataset.armed;b.textContent="✕ Exit";}},3000);}
      break;
    case"q-mute":settings.mute=!settings.mute;saveSettings();if(settings.mute)cancelSpeech();ui();break;
    case"q-mic":
      if(!me||me.state!=="LISTENING")break;
      if(me.micOn){stopListening(me);ui();}
      else{me.userTapped=true;me.micMsg="";if(me.micStatus==="denied"||me.micStatus==="nomic"||me.micStatus==="network")me.micStatus="idle";sfx.mic();startListen(me);}
      break;
    case"q-replay":if(me&&!me.fb)replay(me);break;
    case"q-hint":if(me&&me.state==="LISTENING")giveHint(me);break;
    case"q-skip":if(me&&me.state!=="FEEDBACK"&&me.state!=="PROCESSING")skip(me);break;
    case"q-type":if(me){me.typed=!me.typed;ui();if(me.typed){const i=$("#typeIn");if(i)i.focus();}}break;
    case"q-submit":typedSubmit();break;
    case"q-next":if(me&&me.waitNext){cancelSpeech();askQuestion();}break;
    case"q-retry":retryQuestion();break;
  }
}
/* keep the timer ring and mic UI fresh */
addEventListener("pagehide",cleanup);
document.addEventListener("visibilitychange",()=>{if(document.hidden&&quiz&&quiz.state==="LISTENING"){/* browsers stop mic in background; user can tap again */}});
render();
</script>
