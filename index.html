<html lang="en">
<head>
<meta charset="utf-8">

<title>Science Wonder Quiz Bee</title>

<style>
:root{

}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1633;--bg2:#1a1242;--card:#19234a;--ink:#f1f4ff;--muted:#b3bfe4;--line:#2d3b6e;
    --ok:#5cecb9;--okbg:#0f3a2f;--bad:#ff9db0;--badbg:#4a1a28;--warn:#ffd36b;--warnbg:#4a3a0c;
    --shadow:0 6px 0 rgba(0,0,0,.35),0 14px 28px rgba(0,0,0,.3);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1633;--bg2:#1a1242;--card:#19234a;--ink:#f1f4ff;--muted:#b3bfe4;--line:#2d3b6e;
  --ok:#5cecb9;--okbg:#0f3a2f;--bad:#ff9db0;--badbg:#4a1a28;--warn:#ffd36b;--warnbg:#4a3a0c;
  --shadow:0 6px 0 rgba(0,0,0,.35),0 14px 28px rgba(0,0,0,.3);color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);background:linear-gradient(160deg,var(--bg),var(--bg2));
  font-family:"Fredoka","Trebuchet MS",system-ui,"Segoe UI",Roboto,sans-serif;font-size:18px;line-height:1.45}
h1,h2,h3{margin:.2em 0 .4em;line-height:1.15}
h1{font-size:clamp(1.8rem,5vw,2.8rem)} h2{font-size:1.4rem} h3{font-size:1.15rem}
p{margin:.4em 0}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 60px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.small{font-size:.9rem;color:var(--muted)}
:focus-visible{outline:4px solid var(--yellow);outline-offset:2px;box-shadow:0 0 0 7px var(--onbright)}
button,input,select,textarea{font:inherit;color:inherit}
.btn{min-height:56px;border:0;border-radius:20px;padding:12px 22px;font-weight:600;font-size:1.1rem;cursor:pointer;color:#fff;
  background:var(--blue);box-shadow:0 5px 0 rgba(0,0,0,.22);transition:transform .1s,box-shadow .1s;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.btn.purple{background:var(--purple)} .btn.coral{background:var(--coral)}
.btn.mint{background:var(--mint);color:var(--onbright)} .btn.yellow{background:var(--yellow);color:var(--onbright)}
.btn.ghost{background:var(--card);color:var(--ink);border:3px solid var(--line);box-shadow:none}
.btn.sm{min-height:48px;padding:8px 16px;font-size:1rem;border-radius:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border-radius:26px;padding:18px 20px;box-shadow:var(--shadow);margin:16px 0}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.row.center{justify-content:center}
.grid{display:grid;gap:14px}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:.9rem;font-weight:600;background:var(--line);color:var(--ink)}
.chip.lv-easy{background:var(--mint);color:var(--onbright)} .chip.lv-hard{background:var(--yellow);color:var(--onbright)}
.chip.lv-advanced{background:var(--purple);color:#fff}
input[type=text],select,textarea{width:100%;min-height:52px;border-radius:16px;border:3px solid var(--line);background:var(--card);padding:10px 14px}
label{font-weight:600;display:block;margin:8px 0 4px}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:6px}
.mascot{width:150px;flex:none}
.bubble{flex:1;min-width:240px;background:var(--card);border-radius:28px;padding:16px 22px;box-shadow:var(--shadow);position:relative}
.robot{width:100%;height:auto;animation:bob 3s ease-in-out infinite}
.robot .mouth{transform-origin:60px 63px}
.speaking .robot .mouth{animation:talk .28s ease-in-out infinite alternate}
.listening .robot .ear{fill:var(--yellow);animation:pulse 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes talk{to{transform:scaleY(2.6)}}
@keyframes pulse{50%{opacity:.45}}
.levels button{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;background:var(--card);border:4px solid var(--line);border-radius:24px;padding:14px 16px;box-shadow:var(--shadow);min-height:56px}
.levels button[aria-checked=true]{border-color:var(--blue);background:var(--card);outline:3px solid var(--yellow)}
.levels .tick{float:right;font-weight:700;color:var(--ok)}
.levels b{font-size:1.2rem}
.tiles .btn{flex:1 1 200px}
.banner{border-radius:18px;padding:10px 16px;margin:10px 0;font-weight:500}
.banner.warn{background:var(--warnbg);color:var(--warn)} .banner.bad{background:var(--badbg);color:var(--bad)} .banner.ok{background:var(--okbg);color:var(--ok)}
/* quiz */
.qtop{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar{height:16px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 2px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--blue));border-radius:99px;transition:width .4s}
.stage{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start}
.qcard{background:var(--card);border-radius:26px;padding:18px 20px;box-shadow:var(--shadow);position:relative;min-height:170px}
.qcard h2{font-size:clamp(1.3rem,3.6vw,2rem);margin-right:96px}
.hostsay{background:var(--card);border-radius:20px;padding:10px 14px;margin-top:8px;font-size:.95rem;color:var(--muted);box-shadow:var(--shadow)}
.timer{position:absolute;right:14px;top:14px;width:84px;height:84px}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:9}
.timer .bg{stroke:var(--line)} .timer .fg{stroke:var(--blue);stroke-linecap:round;stroke-dasharray:283;transition:stroke-dashoffset .12s linear}
.timer.low .fg{stroke:var(--coral)}
.timer span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:1.5rem}
.micarea{text-align:center;margin-top:12px}
.mic{width:120px;height:120px;border-radius:50%;border:0;background:var(--purple);color:#fff;font-size:3rem;cursor:pointer;box-shadow:0 8px 0 rgba(0,0,0,.22);position:relative}
.mic.listening{background:var(--coral);animation:ring 1.2s ease-out infinite}
.mic.busy{background:var(--muted);cursor:default}
@keyframes ring{0%{box-shadow:0 8px 0 rgba(0,0,0,.22),0 0 0 0 rgba(232,83,47,.55)}100%{box-shadow:0 8px 0 rgba(0,0,0,.22),0 0 0 28px rgba(232,83,47,0)}}
.miclabel{font-weight:600;font-size:1.2rem;margin-top:8px;min-height:1.6em}
.heard{min-height:1.6em;color:var(--muted);font-style:italic}
.fb{border-radius:24px;padding:16px 20px;margin:14px 0;font-weight:500;display:flex;gap:14px;align-items:flex-start}
.fb.ok{background:var(--okbg);color:var(--ok)} .fb.bad{background:var(--badbg);color:var(--bad)} .fb.time{background:var(--warnbg);color:var(--warn)}
.fb .ic{font-size:2rem;line-height:1} .fb b{display:block;font-size:1.25rem}
.fb .ans{color:var(--ink);font-weight:500}
.pop{animation:pop .5s ease}
@keyframes pop{40%{transform:scale(1.18)}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.typebox{display:flex;gap:10px;max-width:560px;margin:10px auto 0}
.typebox input{flex:1}
.stat{background:var(--card);border-radius:22px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:2rem}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.badge{background:var(--card);border-radius:22px;padding:12px;text-align:center;border:3px solid var(--line)}
.badge.on{border-color:var(--yellow)} .badge.off{opacity:.55}
.badge .em{font-size:2.4rem}
.tbar{height:14px;border-radius:99px;background:var(--line);overflow:hidden} .tbar>i{display:block;height:100%;background:var(--mint)}
.item{border-left:8px solid var(--line);padding:10px 14px;margin:12px 0;background:var(--card);border-radius:0 20px 20px 0;box-shadow:var(--shadow)}
.item.ok{border-color:var(--ok)} .item.bad{border-color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:.95rem} td,th{padding:8px 6px;border-bottom:2px solid var(--line);text-align:left}
input[type=range]{width:100%;height:36px}
.switch{display:flex;align-items:center;gap:12px;min-height:48px}
.switch input{width:28px;height:28px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (max-width:640px){
  .stage{grid-template-columns:1fr}.stage .host{display:flex;gap:12px;align-items:center}.stage .host .mascot{width:90px}.stage .hostsay{flex:1;margin:0}
  .mascot{width:110px} .mic{width:104px;height:104px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

const NUMW={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19};
const TENW={twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};
const NEG=new Set(["not","never","dont","doesnt","isnt","cant","wont","didnt","arent","wasnt","cannot"]);
function stemWord(w){
  if(w.length<=3||w.indexOf("*")>=0||w.indexOf("=")>=0||/\d/.test(w))return w;
  if(/ies$/.test(w))return w.slice(0,-3)+"y";
  if(/(ses|xes|ches|shes|zes)$/.test(w))return w.slice(0,-2);
  if(/[^s]s$/.test(w))return w.slice(0,-1);
  return w;
}
function normText(s,isKey){
  s=String(s).toLowerCase().replace(/[’'`]/g,"").replace(/°/g," degrees ").replace(/[–—-]/g," ");
  s=s.replace(isKey?/[^a-z0-9.\/*|= ]/g:/[^a-z0-9.\/ ]/g," ");
  s=s.replace(/\.(?!\d)|(?<!\d)\./g," ").replace(/\/(?!\d)|(?<!\d)\//g," ");
  return s.replace(/\s+/g," ").trim();
}
function numberize(tk){
  const out=[];let i=0;
  const isN=w=>w in NUMW||w in TENW||w==="hundred";
  while(i<tk.length){
    if(!isN(tk[i])){out.push(tk[i]);i++;continue;}
    let cur=0,j=i;
    while(j<tk.length){
      const w=tk[j];
      if(w in NUMW)cur+=NUMW[w];else if(w in TENW)cur+=TENW[w];else if(w==="hundred")cur=(cur||1)*100;
      else if(w==="and"&&j>i&&j+1<tk.length&&isN(tk[j+1])){j++;continue;}
      else break;
      j++;
    }
    let str=String(cur);
    if(tk[j]==="point"&&j+1<tk.length&&(tk[j+1] in NUMW&&NUMW[tk[j+1]]<10||/^\d$/.test(tk[j+1]))){
      let dec="";j++;
      while(j<tk.length&&((tk[j] in NUMW&&NUMW[tk[j]]<10)||/^\d$/.test(tk[j]))){dec+=(tk[j] in NUMW?NUMW[tk[j]]:tk[j]);j++;}
      str+="."+dec;
    }
    out.push(str);i=j;
  }
  return out;
}
function toks(s,isKey){
  const t=normText(s,isKey).split(" ").filter(Boolean);

}
function lev(a,b){
  if(a===b)return 0;const m=a.length,n=b.length;if(!m||!n)return Math.max(m,n);
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++){cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));}prev=cur;}
  return prev[n];
}
function tokMatch(p,t){
  if(p.endsWith("*")){const pre=p.slice(0,-1);return t.startsWith(pre);}
  if(p.endsWith("="))return p.slice(0,-1)===t;
  if(p===t)return true;
  if(p[0]===t[0]&&p.length>=6&&!/\d/.test(p)&&!/\d/.test(t)){return lev(p,t)<=(p.length>=10?2:1);}
  return false;
}
function phraseIn(T,alt){
  const P=toks(alt,true);if(!P.length)return false;
  for(let i=0;i+P.length<=T.length;i++){let ok=true;for(let j=0;j<P.length;j++){if(!tokMatch(P[j],T[i+j])){ok=false;break;}}if(ok)return true;}
  return false;
}
function anyAlt(T,altStr){return altStr.split("|").some(a=>a.trim()&&phraseIn(T,a));}
const IDK=/\b(i )?(dont|do not) know\b|\bnot sure\b|\bno idea\b|\bidk\b|\bi give up\b/;
function evalOne(q,text){
  const raw=normText(text);
  if(!raw)return "unsure";
  if(IDK.test(raw))return "idk";
  const T=toks(text);
  if(!T.length)return "unsure";
  if(!q.neg&&T.some(t=>NEG.has(t)))return "wrong";
  if(q.bad&&q.bad.some(p=>phraseIn(T,p)))return "wrong";
  if(q.count){
    const n=q.k[0].filter(c=>anyAlt(T,c)).length;
    return n>=q.count?"correct":n>0?"partial":"wrong";
  }
  const hits=q.k.filter(g=>g.some(a=>anyAlt(T,a))).length;

  return hits>=need?"correct":hits>0?"partial":"wrong";
}
function judge(q,alts){
  const list=alts.slice(0,2);

  if(rs.includes("correct"))return "correct";

}
function parseCommand(text){

  if(/^(skip|skip (this )?question|pass)( please)?$/.test(n))return "skip";
  if(/^(stop|end|quit|exit)( the)? quiz$|^quit$|^exit$/.test(n))return "stop";
  if(/^((what is|whats|what s|tell me) )?(my )?score( please)?$/.test(n))return "score";

}

}

ause disease.","a":"False","k":[["false","incorrect","untrue","not true","wrong"]],"neg":1,"x":"Many bacteria are helpful. They help us digest food and make foods like yogurt."},{"id":"w101","level":"easy","t":"L","q":"What is reproduction?","a":"The process of producing offspring.","k":[["produc*","make*","creat*","offspring","babies","baby","young"]]},{"id":"w102","level":"easy","t":"L","q":"What do we call animals that lay eggs?","a":"Oviparous.","k":[["ovipar*","egg laying","egg layers"]]},{"id":"w103","level":"easy","t":"L","q":"What do we call animals that give birth to live young?","a":"Viviparous.","k":[["vivipar*"]]},{"id":"w104","level":"hard","t":"L","q":"What is fertilization inside the female body called?","a":"Internal fertilization.","k":[["internal="]]},{"id":"w105","level":"hard","t":"L","q":"What is fertilization outside the body called?","a":"External fertilization.","k":[["external=","outside"]]},{"id":"w106","level":"hard","t":"L","q":"What do mammal mothers normally produce to feed their young?","a":"Milk.","k":[["milk"]]},{"id":"w107","level":"easy","t":"L","q":"Which animal normally lays eggs? Choices: A. Chicken. B. Cow. C. Cat. D. Dog.","a":"A. Chicken","k":[["chicken","letter a","option a","answer a","choice a"]]},{"id":"w108","level":"hard","t":"L","q":"Which usually shows external fertilization? Choices: A. Many frogs. B. Chickens. C. Dogs. D. Humans.","a":"A. Many frogs","k":[["frog*","letter a","option a","answer a","choice a"]]},{"id":"w109","level":"easy","t":"L","q":"True or False: Reproduction helps a species continue from one generation to the next.","a":"True","k":[["true","yes","correct","right"]],"x":"Without reproduction a species would die out, so it is how life continues."},{"id":"w110","level":"easy","t":"L","q":"True or False: All mammals give birth to live young.","a":"False","k":[["false","incorrect","untrue","not true","wrong"]],"neg":1,"x":"The platypus and the echidna are mammals that lay eggs."},{"id":"w111","level":"easy","t":"L","q":"What is a life cycle?","a":"The stages an organism passes through during its life.","k":[["stage*","change*","series","steps","birth","growth"]]},{"id":"w112","level":"easy","t":"L","q":"What stage comes after an egg hatches in a chicken?","a":"Chick.","k":[["chick*"]]},{"id":"w113","level":"easy","t":"L","q":"What does incubation help a bird embryo do?","a":"Develop inside the egg under suitable conditions.","k":[["develop*","grow*","warm*","heat*","keep*","hatch*","temperature"]]},{"id":"w114","level":"hard","t":"L","q":"Which stage follows infancy in a typical mammal life cycle?","a":"Young or juvenile stage.","k":[["juvenile","young","child*"]]},{"id":"w115","level":"hard","t":"L","q":"What is growth?","a":"Increase in size.","k":[["increas*","bigger","size","grow*","larger"]]},{"id":"w116","level":"hard","t":"L","q":"What is development?","a":"Changes in structure and functions as an organism matures.","k":[["change*","mature*","structure","function*","develop*","ability"]]},{"id":"w117","level":"easy","t":"L","q":"Which is the usual bird life-cycle order? Choices: A. Egg, adult, chick, juvenile. B. Adult, egg, adult, chick. C. Chick, egg, adult, juvenile. D. Egg, chick, juvenile, adult.","a":"D. Egg, chick, juvenile, adult","k":[["d","egg chick juvenile adult"]]},{"id":"w118","level":"hard","t":"L","q":"Which mammal trait helps nourish newborn offspring? Choices: A. Gills. B. Scales only. C. Milk production. D. Feathers.","a":"C. Milk production","k":[["c","milk"]]},{"id":"w119","level":"easy","t":"L","q":"True or False: Birds begin life developing inside eggs.","a":"True","k":[["true","yes","correct","right"]],"x":"All birds lay eggs, and the chick grows inside the egg until it hatches."},{"id":"w120","level":"easy","t":"L","q":"True or False: Growth and development mean exactly the same thing.","a":"False","k":[["false","incorrect","untrue","not true","wrong"]],"neg":1,"x":"Growth means getting bigger. Development means changing in structure and ability. They are related, but not the same."},{"id":"w121","level":"easy","t":"L","q":"What is the beginning of growth of a seed called?","a":"Germination.","k":[["germinat*"]]},{"id":"w122","level":"easy","t":"L","q":"What three things do most seeds need for germination?","a":"Water, oxygen, and suitable temperature.","k":[["water"],["oxygen","air"],["temperature","warm*","heat"]]},{"id":"w123","level":"easy","t":"L","q":"What is a young plant called after germination?","a":"Seedling.","k":[["seedling*"]]},{"id":"w124","level":"hard","t":"L","q":"What process transfers pollen from anther to stigma?","a":"Pollination.","k":[["pollinat*"]]},{"id":"w125","level":"hard","t":"L","q":"What is seed dispersal?","a":"The spreading of seeds away from the parent plant.","k":[["spread*","scatter*","move*","carr*","away","dispers*"]]},{"id":"w126","level":"hard","t":"L","q":"What plant structure contains a baby plant and stored food?","a":"Seed.","k":[["seed*"]]},{"id":"w127","level":"easy","t":"L","q":"Which is a seed-dispersal method? Choices: A. Plastic ruler. B. Wind. C. Television. D. Flashlight.","a":"B. Wind","k":[["b","wind"]]},{"id":"w128","level":"hard","t":"L","q":"Which flower part receives pollen? Choices: A. Root. B. Petal tip only. C. Stigma. D. Leaf vein.","a":"C. Stigma","k":[["c","stigma*"]]},{"id":"w129","level":"easy","t":"L","q":"True or False: A mature flowering plant can produce seeds.","a":"True","k":[["true","yes","correct","right"]],"x":"After pollination, a flowering plant makes seeds inside its fruit."},{"id":"w130","level":"easy","t":"L","q":"True or False: All seeds require direct sunlight to germinate.","a":"False","k":[["false","incorrect","untrue","not true","wrong"]],"neg":1,"x":"Most seeds germinate underground in the dark. They need water, oxygen and warmth."},{"id":"w131","level":"easy","t":"AD","q":"What is an adaptation?","a":"A trait that helps an organism survive and reproduce in its environment.","k":[["trait*","feature*","help*","surviv*","environment","habitat"]]},{"id":"w132","level":"easy","t":"AD","q":"What cactus feature helps it store water?","a":"Thick, fleshy stem.","k":[["stem*","fleshy","thick"]]},{"id":"w133","level":"easy","t":"AD","q":"What cactus structures can reduce water loss and protect it?","a":"Spines.","k":[["spine*","thorn*","needle*"]]},{"id":"w134","level":"hard","t":"AD","q":"What coastal tree has special roots suited to muddy shorelines?","a":"Mangrove.","k":[["mangrove*"]]},{"id":"w135","level":"hard","t":"AD","q":"What water plant has broad leaves that float on the surface?","a":"Water lily.","k":[["lily","lotus"]]},{"id":"w136","level":"hard","t":"AD","q":"What plant uses modified pitcher-shaped leaves to trap small animals?","a":"Pitcher plant.","k":[["pitcher*"]]},{"id":"w137","level":"easy","t":"AD","q":"Which helps a climbing plant reach sunlight? Choices: A. Hooves. B. Feathers. C. Gills. D. Tendrils.","a":"D. Tendrils","k":[["d","tendril*"]]},{"id":"w138","level":"hard","t":"AD","q":"Why are many cactus surfaces waxy? Choices: A. To absorb salt water faster. B. To attract magnets. C. To reduce water loss. D. To make seeds fly.","a":"C. To reduce water loss","k":[["c","water loss","lose water","keep water","waterproof","reduce water"]]},{"id":"w139","level":"easy","t":"AD","q":"True or False: Mangroves have traits that help them live in coastal conditions.","a":"True","k":[["true","yes","correct","right"]],"x":"Mangroves have special roots that hold them in muddy, salty shores."},{"id":"w140","level":"easy","t":"AD","q":"True or False: Plants grow new inherited adaptations instantly just because they need them.","a":"False","k":[["false","incorrect","untrue","not true","wrong"]],"neg":1,"x":"Adaptations are inherited traits that build up over many generations. A plant cannot change its inherited traits instantly."},{"id":"w141","level":"easy","t":"AD","q":"What is camouflage?","a":"Coloring or form that helps an animal blend with its surroundings.","k":[["blend*","hide*","hid","hiding","color*","colour*","surround*","disguise*"]]},{"id":"w142","level":"easy","t":"AD","q":"What is mimicry?","a":"Resembling another organism or object for an advantage.","k":[["resembl*","look*","copy*","imitat*","mimic*","like"]]},{"id":"w143","level":"easy","t":"AD","q":"What adaptation helps ducks paddle in water?","a":"Webbed feet.","k":[["web*"]]},{"id":"w144","level":"hard","t":"AD","q":"What is migration?","a":"Seasonal movement from one area to another.","k":[["move*","travel*","season*","journey*","migrat*"]]},{"id":"w145","level":"hard","t":"AD","q":"What does nocturnal mean?","a":"Active mainly at night.","k":[["night"]]},{"id":"w146","level":"hard","t":"AD","q":"What does hibernation mean?","a":"A period of greatly reduced activity and energy use.","k":[["sleep*","rest*","winter","reduc*","inactiv*","slow*","energy"]]},{"id":"w147","level":"easy","t":"AD","q":"Which is a behavioral adaptation? Choices: A. Fish scales. B. A turtle shell. C. Bird migration. D. Sharp claws.","a":"C. Bird migration","k":[["c","migrat*"]]},{"id":"w148","level":"hard","t":"AD","q":"Which adaptation helps a fish get oxygen from water? Choices: A. Gills. B. Feathers. C. Fur. D. Wings.","a":"A. Gills","k":[["gill*","letter a","option a","answer a","choice a"]]},{"id":"w149","level":"easy","t":"AD","q":"True or False: Camouflage can help prey avoid predators.","a":"True","k":[["true","yes","correct","right"]],"x":"When an animal blends in with its surroundings, predators have a hard time seeing it."},{"id":"w150","level":"easy","t":"AD","q":"True or False: Nocturnal animals are most active in daytime.","a":"False","k":[["false","incorrect","untrue","not true","wrong"]],"neg":1,"x":"Nocturnal animals are most active at night. Animals that are active in the day are called diurnal."},{"id":"w151","level":"easy","t":"F","q":"What is a force?","a":"A push or a pull.","k":[["push","pull"]]},{"id":"w152","level":"easy","t":"F","q":"What contact force does a hand apply when moving a cart?","a":"Applied force.","k":[["applied","push*","pull*"]]},{"id":"w153","level":"easy","t":"F","q":"What force supports a book resting on a table?","a":"Normal or support force.","k":[["normal","support*"]]},{"id":"w154","level":"hard","t":"F","q":"What is the unit of force?","a":"Newton (N).","k":[["newton*"]]},{"id":"w155","level":"hard","t":"F","q":"Which instrument measures force?","a":"Spring scale (force meter).","k":[["spring scale","force meter","spring balance","newton meter","forcemeter"]]},{"id":"w156","level":"hard","t":"F","q":"What are forces called when they cancel out with no change in motion?","a":"Balanced forces.","k":[["balanced=","balance"]]},{"id":"w157","level":"easy","t":"F","q":"Which is a contact force? Choices: A. A magnet attracting a nail across a gap. B. Pushing a chair. C. Gravity pulling an apple. D. Earth pulling the Moon.","a":"B. Pushing a chair","k":[["b","push*"]]},{"id":"w158","level":"hard","t":"F","q":"What can an unbalanced force change? Choices: A. Motion. B. The meaning of a unit. C. An object into sunlight. D. The number of atoms in an object.","a":"A. Motion","k":[["motion","letter a","option a","answer a","choice a"]]},{"id":"w159","level":"easy","t":"F","q":"True or False: A force can change an object's speed or direction.","a":"True","k":[["true","yes","correct","right"]],"x":"A push or pull can make an object speed up, slow down, stop, or turn."},{"id":"w160","level":"easy","t":"F","q":"True or False: Contact forces can act without objects or materials interacting through contact.","a":"False","k":[["false","incorrect","untrue","not true","wrong"]],"neg":1,"x":"Contact forces need touching. Forces like gravity and magnetism can act at a distance."},{"id":"w161","level":"easy","t":"F","q":"What force resists sliding between touching surfaces?","a":"Friction.","k":[["friction*"]]},{"id":"w162","level":"easy","t":"F","q":"Why can shoes grip the ground?","a":"Friction between shoe soles and ground.","k":[["friction*"]]},{"id":"w163","level":"easy","t":"F","q":"Which usually produces more friction, rough or smooth surfaces?","a":"Rough surfaces.","k":[["rough"]]},{"id":"w164","level":"hard","t":"F","q":"What substance can reduce friction in moving machine parts?","a":"Lubricant (such as oil).","k":[["lubricant*","oil","grease","wax","soap"]]},{"id":"w165","level":"hard","t":"F","q":"What type of friction acts when a box slides on the floor?","a":"Sliding friction.","k":[["sliding","kinetic"]]},{"id":"w166","level":"hard","t":"F","q":"What type of friction helps stop a foot from slipping before motion begins?","a":"Static friction.","k":[["static"]]},{"id":"w167","level":"easy","t":"F","q":"Which action generally reduces friction? Choices: A. Using wheels. B. Making a surface rougher. C. Using sticky rubber. D. Pressing surfaces together harder.","a":"A. Using wheels","k":[["wheel*","letter a","option a","answer a","choice a"]]},{"id":"w168","level":"hard","t":"F","q":"What force makes bicycle brakes useful? Choices: A. Gravity alone. B. Buoyancy. C. Friction. D. Magnetism alone.","a":"C. Friction","k":[["c","friction"]]},{"id":"w169","level":"easy","t":"F","q":"True or False: Friction sometimes produces heat.","a":"True","k":[["true","yes","correct","right"]],"x":"Rubbing your hands together makes them warm because of friction."},{"id":"w170","level":"easy","t":"F","q":"True or False: Friction is always harmful.","a":"False","k":[["false","incorrect","untrue","not true","wrong"]],"neg":1,"x":"Friction helps us walk, grip things, and stop bicycles and cars."},{"id":"w171","level":"easy","t":"F","q":"What is gravity?","a":"Attractive force between objects with mass.","k":[["pull*","attract*","force"],["mass","object*","earth","things","matter"]]},{"id":"w172","level":"easy","t":"F","q":"In what direction does Earth pull nearby falling objects?","a":"Toward Earth's center.","k":[["toward","down*","center","centre","earth"]]},{"id":"w173","level":"easy","t":"F","q":"Does gravity need physical contact to act?","a":"No; it is a noncontact force.","k":[["no","noncontact","non contact","doesnt","does not need","without"]],"neg":1},{"id":"w174","level":"hard","t":"F","q":"What quantity changes if a person travels from Earth to the Moon: mass or weight?","a":"Weight.","k":[["weight"]],"bad":["mass"]},{"id":"w175","level":"hard","t":"F","q":"Which force helps keep the Moon in orbit around Earth?","a":"Gravity.","k":[["gravity","gravitational"]]},{"id":"w176","level":"hard","t":"F","q":"Why is the same person lighter on the Moon?","a":"The Moon's gravitational pull is weaker than Earth's.","k":[["weak*","less","gravity","smaller","lower","gravitational"]]},{"id":"w177","level":"easy","t":"F","q":"Which statement about mass is correct? Choices: A. Mass becomes zero on the Moon. B. Mass depends on the shoes worn. C. Mass stays nearly the same on Earth and Moon. D. Mass is the same as speed.","a":"C. Mass stays nearly the same on Earth and Moon.","k":[["c","stay*","nearly"]]},{"id":"w178","level":"hard","t":"F","q":"What pulls a dropped ball downward? Choices: A. Static electricity. B. Sound. C. Light. D. Gravity.","a":"D. Gravity","k":[["d","gravity"]]},{"id":"w179","level":"easy","t":"F","q":"True or False: Gravity acts between any two objects that have mass.","a":"True","k":[["true","yes","correct","right"]],"x":"Every object with mass pulls on every other object. We only notice it when one object is huge, like Earth."},{"id":"w180","level":"easy","t":"F","q":"True or False: Heavier objects always fall faster in a vacuum.","a":"False","k":[["false","incorrect","untrue","not true","wrong"]],"neg":1,"x":"In a vacuum there is no air resistance, so heavy and light objects fall at the same rate."},{"id":"w181","level":"easy","t":"E","q":"What are the two kinds of electric charge?","a":"Positive and negative.","k":[["positive"],["negative"]]},{"id":"w182","level":"easy","t":"E","q":"What happens when two like electric charges approach?","a":"They repel.","k":[["repel*","repuls*","push*"]]},{"id":"w183","level":"easy","t":"E","q":"What happens when opposite electric charges approach?","a":"They attract.","k":[["attract*","pull*"]]},{"id":"w184","level":"hard","t":"E","q":"What do we call a buildup of charge on an object?","a":"Static electricity.","k":[["static"]]},{"id":"w185","level":"hard","t":"E","q":"Which tiny particles often transfer when objects are rubbed?","a":"Electrons.","k":[["electron*"]]},{"id":"w186","level":"hard","t":"E","q":"What large natural electrical discharge can happen during a storm?","a":"Lightning.","k":[["lightning","lightening"]]},{"id":"w187","level":"easy","t":"E","q":"What is a good electrical insulator? Choices: A. Copper wire. B. Dry rubber. C. Aluminum foil. D. Iron nail.","a":"B. Dry rubber","k":[["b","rubber"]]},{"id":"w188","level":"hard","t":"E","q":"Which charges attract? Choices: A. Positive and negative. B. Negative and negative. C. Positive and positive. D. Two positive charges only.","a":"A. Positive and negative","k":[["positive and negative","negative and positive","opposite*","letter a","option a","answer a","choice a"]]},{"id":"w189","level":"easy","t":"E","q":"True or False: Rubbing a balloon on hair may cause charge transfer.","a":"True","k":[["true","yes","correct","right"]],"x":"Electrons move from one surface to the other when they rub, which leaves each one charged."},{"id":"w190","level":"easy","t":"E","q":"True or False: Like electric charges attract each other.","a":"False","k":[["false","incorrect","untrue","not true","wrong"]],"neg":1,"x":"Like charges repel each other. Opposite charges attract."},{"id":"w191","level":"easy","t":"E","q":"What is an electric circuit?","a":"A path along which current can flow.","k":[["path","loop","route","flow*","current"]]},{"id":"w192","level":"easy","t":"E","q":"What component supplies electrical energy to a simple battery circuit?","a":"Battery or cell.","k":[["battery","batteries","cell","power source"]]},{"id":"w193","level":"easy","t":"E","q":"What happens to a bulb when a simple series circuit is open?","a":"It goes off because the path is broken.","k":[["off","out","not light*","doesnt light","stop*","dark"]],"neg":1},{"id":"w194","level":"hard","t":"E","q":"What do we call a circuit with a complete conducting path?","a":"Closed circuit.","k":[["closed","complete*"]]},{"id":"w195","level":"hard","t":"E","q":"What component lets us intentionally open or close a circuit?","a":"Switch.","k":[["switch*"]]},{"id":"w196","level":"hard","t":"E","q":"What is an electrical conductor?","a":"A material that allows electric charge to move easily.","k":[["allow*","let*","pass*","carr*","flow*","move*","conduct*"],["electric*","current","charge","energy"]]},{"id":"w197","level":"easy","t":"E","q":"Which is a typical conductor? Choices: A. Dry plastic. B. Copper. C. Dry wood. D. Rubber.","a":"B. Copper","k":[["b","copper"]]},{"id":"w198","level":"hard","t":"E","q":"What is the main purpose of wires in a simple circuit? Choices: A. Create food for the bulb. B. Make light without a battery. C. Stop all current. D. Provide a conducting path.","a":"D. Provide a conducting path","k":[["d","path","conduct*","carry*"]]},{"id":"w199","level":"easy","t":"E","q":"True or False: A closed circuit allows current to flow when a source is connected.","a":"True","k":[["true","yes","correct","right"]],"x":"In a closed circuit the path is complete, so the battery can push current around it."},{"id":"w200","level":"easy","t":"E","q":"True or False: It is safe for children to experiment with wall outlets.","a":"False","k":[["false","incorrect","untrue","not true","wrong"]],"neg":1,"x":"Wall outlets carry dangerous electricity that can cause serious shock. Use batteries for experiments."},{"id":"w202","level":"easy","t":"E","q":"What happens when two north poles are brought near each other?","a":"They repel.","k":[["repel*","repuls*","push*"]]},{"id":"w203","level":"easy","t":"E","q":"Which metal is commonly attracted by a magnet?","a":"Iron.","k":[["iron","steel","nickel","cobalt"]]},{"id":"w204","level":"hard","t":"E","q":"What surrounds a wire when electric current flows through it?","a":"Magnetic field.","k":[["magnetic","field"]]},{"id":"w205","level":"hard","t":"E","q":"What do we call a current-carrying coil that acts like a magnet?","a":"Electromagnet.","k":[["electromagnet*","electro magnet*"]]},{"id":"w206","level":"hard","t":"E","q":"How can an electromagnet be switched off?","a":"Stop the current flowing through its coil.","k":[["stop*","turn* off","switch* off","off","disconnect*","current","remov*","battery"]],"neg":1},{"id":"w207","level":"easy","t":"E","q":"Which device often uses an electromagnet? Choices: A. Drinking glass. B. Wooden spoon. C. Electric bell. D. Plain notebook.","a":"C. Electric bell","k":[["c","bell"]]},{"id":"w208","level":"hard","t":"E","q":"What do unlike magnetic poles do? Choices: A. Disappear. B. Repel. C. Attract. D. Turn into electric cells.","a":"C. Attract","k":[["c","attract*"]]},{"id":"w209","level":"easy","t":"E","q":"True or False: Electric current can create a magnetic field.","a":"True","k":[["true","yes","correct","right"]],"x":"A wire carrying current has a magnetic field around it. That is how electromagnets work."},{"id":"w210","level":"easy","t":"E","q":"True or False: Every metal is strongly attracted by ordinary magnets.","a":"False","k":[["false","incorrect","untrue","not true","wrong"]],"neg":1,"x":"Only some metals, such as iron, steel, nickel and cobalt, are strongly attracted. Copper and aluminum are not."},{"id":"w211","level":"advanced","t":"M","q":"A puddle disappears after a sunny afternoon. Which process explains this?","a":"Evaporation.","k":[["evaporat*"]]},{"id":"w212","level":"advanced","t":"M","q":"A cold glass collects drops of water on its outer surface. Where did the water originate?","a":"Water vapor in the surrounding air.","k":[["vapor","vapour","air","humidity","moisture"]]},{"id":"w213","level":"advanced","t":"I","q":"A 2 liter bottle contains how many milliliters?","a":"2,000 mL.","k":[["2 000","2000","2 thousand","two thousand"]]},{"id":"w214","level":"advanced","t":"I","q":"A ruler reads 35 centimeters. How many millimeters is that?","a":"350 mm.","k":[["350"]]},{"id":"w215","level":"advanced","t":"I","q":"A pupil tests whether fertilizer changes plant height. What should be measured?","a":"Plant height (the dependent variable).","k":[["height","growth","size","tall*","grow*"]]},{"id":"w216","level":"advanced","t":"I","q":"In that fertilizer test, name one variable to keep the same.","a":"Plant type, water, light, pot size, or soil amount.","k":[["plant type","type of plant","kind of plant","plant species","species","water","light","pot","soil","sun*","temperature","seed*"]]},{"id":"w217","level":"advanced","t":"I","q":"Is \"the water is warm\" qualitative or quantitative?","a":"Qualitative.","k":[["qualitative="]],"bad":["quantitative="]},{"id":"w218","level":"advanced","t":"I","q":"Is \"the water is 38 degrees Celsius\" qualitative or quantitative?","a":"Quantitative.","k":[["quantitative="]],"bad":["qualitative="]},{"id":"w219","level":"advanced","t":"DG","q":"A child bites an apple. Is chewing mechanical or chemical digestion?","a":"Mechanical digestion.","k":[["mechanical=","mechanic*"]],"bad":["chemical"]},{"id":"w220","level":"advanced","t":"DG","q":"Which organ absorbs most digested nutrients into the body?","a":"Small intestine.","k":[["small intestine","small bowel"]]},{"id":"w221","level":"advanced","t":"R","q":"During breathing in, does the diaphragm generally move up or down?","a":"Down.","k":[["down","downward","downwards","lower*"]],"bad":["up","upward","upwards"]},{"id":"w222","level":"advanced","t":"R","q":"What microscopic lung structures exchange gases with the blood?","a":"Alveoli.","k":[["alveoli","alveolus","alveolar"]]},{"id":"w223","level":"advanced","t":"RP","q":"What is the biological name for the joining of egg and sperm?","a":"Fertilization.","k":[["fertiliz*","fertilis*"]]},{"id":"w224","level":"advanced","t":"RP","q":"Which stage of human growth brings many reproductive changes?","a":"Puberty.","k":[["puberty"]]},{"id":"w225","level":"advanced","t":"G","q":"A dolphin breathes air and nurses its babies. Which animal class is it?","a":"Mammal.","k":[["mammal*"]]},{"id":"w226","level":"advanced","t":"G","q":"A butterfly has no backbone. Is it vertebrate or invertebrate?","a":"Invertebrate.","k":[["invertebrate=","in vertebrate"]]},{"id":"w227","level":"advanced","t":"G","q":"A fern has no flowers and reproduces using what?","a":"Spores.","k":[["spore*"]]},{"id":"w228","level":"advanced","t":"EN","q":"Which pigment absorbs much of the light energy used in photosynthesis?","a":"Chlorophyll.","k":[["chlorophyll*"]]},{"id":"w229","level":"advanced","t":"G","q":"Which tiny living organism helps bread dough rise?","a":"Yeast.","k":[["yeast"]]},{"id":"w230","level":"advanced","t":"EC","q":"Why are decomposers useful in nature?","a":"They break down dead matter and recycle nutrients.","k":[["break*","recycl*","nutrient*","dead","rot*","clean*","soil"]]},{"id":"w231","level":"advanced","t":"L","q":"A turtle lays eggs. Is it oviparous or viviparous?","a":"Oviparous.","k":[["oviparous=","ovipar*"]],"bad":["viviparous="]},{"id":"w232","level":"advanced","t":"G","q":"Why is the platypus an unusual mammal?","a":"It lays eggs.","k":[["egg*","lay*"]]},{"id":"w233","level":"advanced","t":"L","q":"What stage comes directly after hatching in a chicken life cycle?","a":"Chick.","k":[["chick*"]]},{"id":"w234","level":"advanced","t":"L","q":"What conditions help eggs develop before a bird hatches?","a":"Suitable warmth and incubation conditions.","k":[["warm*","heat*","temperature","incubat*","nest","sit*","keep*"]]},{"id":"w235","level":"advanced","t":"L","q":"A seed starts growing roots. What process has begun?","a":"Germination.","k":[["germinat*"]]},{"id":"w236","level":"advanced","t":"L","q":"A bee moves pollen from anther to stigma. Name the process.","a":"Pollination.","k":[["pollinat*"]]},{"id":"w237","level":"advanced","t":"L","q":"A coconut floats to another island. What kind of seed dispersal is shown?","a":"Water dispersal.","k":[["water","sea","ocean","float*"]]},{"id":"w238","level":"advanced","t":"AD","q":"Why are a cactus's spines useful in a dry habitat?","a":"They help reduce water loss and offer protection.","k":[["water","protect*","predator*","animal*","shade","reduc*"]]},{"id":"w239","level":"advanced","t":"AD","q":"Why do mangroves have specialized roots?","a":"To support the plant in muddy, often low-oxygen coastal soil.","k":[["support*","anchor*","oxygen","breath*","mud*","stand*","stable","air","salt*","waterlog*","tide*"]]},{"id":"w240","level":"advanced","t":"AD","q":"A leaf insect resembles a leaf. Which adaptation does this show?","a":"Camouflage (leaf-like appearance).","k":[["camouflag*","camoufl*","camoflag*","mimic*"]]},{"id":"w241","level":"advanced","t":"AD","q":"Geese travel long distances seasonally. What is this called?","a":"Migration.","k":[["migrat*"]]},{"id":"w242","level":"advanced","t":"AD","q":"An owl hunts mostly at night. What term describes it?","a":"Nocturnal.","k":[["nocturnal"]]},{"id":"w243","level":"advanced","t":"F","q":"A person pushes a shopping cart. Is this a contact or noncontact force?","a":"Contact force.","k":[["contact="]],"bad":["noncontact","non","no contact"]},{"id":"w244","level":"advanced","t":"F","q":"A book stays still on a desk. Are the vertical forces balanced or unbalanced?","a":"Balanced.","k":[["balanced="]],"bad":["unbalanced="]},{"id":"w245","level":"advanced","t":"F","q":"What SI unit measures force?","a":"Newton (N).","k":[["newton*"]]},{"id":"w246","level":"advanced","t":"F","q":"Why do rubber shoes help on a slippery floor?","a":"They can provide better friction or traction.","k":[["friction","traction","grip*","stick*"]]},{"id":"w247","level":"advanced","t":"F","q":"Why is oil used in a bicycle chain?","a":"To reduce friction and wear.","k":[["friction","wear","smooth*","lubricat*","rust","slide*","move*"]]},{"id":"w248","level":"advanced","t":"F","q":"What force helps tires grip a road during braking?","a":"Friction.","k":[["friction*"]]},{"id":"w249","level":"advanced","t":"F","q":"Why does a ball fall after being dropped?","a":"Earth's gravitational pull.","k":[["gravity","gravitational","earth*"]]},{"id":"w250","level":"advanced","t":"F","q":"If a person visits the Moon, which changes more noticeably, mass or weight?","a":"Weight.","k":[["weight"]],"bad":["mass"]},{"id":"w251","level":"advanced","t":"E","q":"Why does a rubbed balloon sometimes stick to a wall?","a":"Static electrical attraction.","k":[["static","charge*","electr*","attract*"]]},{"id":"w252","level":"advanced","t":"E","q":"Do two negatively charged objects attract or repel?","a":"Repel.","k":[["repel*","repuls*","push*"]]},{"id":"w253","level":"advanced","t":"E","q":"Is copper commonly a conductor or an insulator?","a":"Conductor.","k":[["conduct*"]]},{"id":"w254","level":"advanced","t":"E","q":"A flashlight will not light because a wire is disconnected. Is the circuit open or closed?","a":"Open.","k":[["open="]],"bad":["closed"]},{"id":"w255","level":"advanced","t":"E","q":"In a basic battery-bulb circuit, what must be completed for the bulb to light?","a":"A closed conducting path.","k":[["closed","complete*","path","circuit","loop"]]},{"id":"w256","level":"advanced","t":"E","q":"Two north poles face one another. What happens?","a":"They repel.","k":[["repel*","repuls*","push*"]]},{"id":"w257","level":"advanced","t":"E","q":"A crane lifts scrap iron using a magnet controlled by a switch. What kind of magnet is it?","a":"Electromagnet.","k":[["electromagnet*","electro magnet*"]]},{"id":"w258","level":"advanced","t":"E","q":"Why can an electromagnet be switched off?","a":"Its magnetic field depends on electric current.","k":[["current","electric*","electricity","power","battery"]]},{"id":"w259","level":"hard","t":"M","q":"Water vapor changes directly to frost on a cold surface. What change of state is this?","a":"Deposition.","k":[["deposit*"]]},{"id":"w260","level":"easy","t":"M","q":"What is the opposite of melting?","a":"Freezing.","k":[["freez*","solidif*"]]},{"id":"w261","level":"easy","t":"M","q":"What state of matter is cooking oil?","a":"Liquid.","k":[["liquid"]]},{"id":"w262","level":"easy","t":"M","q":"What state of matter is oxygen at room temperature?","a":"Gas.","k":[["gas"]]},{"id":"w263","level":"hard","t":"M","q":"What type of change is folding a sheet of paper?","a":"Physical change.","k":[["physical"]],"bad":["chemical"]},{"id":"w264","level":"easy","t":"I","q":"What do scientists call information collected during an investigation?","a":"Data.","k":[["data"]]},{"id":"w265","level":"hard","t":"I","q":"What is a graph used for in an investigation?","a":"To organize and show patterns in data.","k":[["organiz*","organis*","show*","pattern*","data","compar*","display*","trend*","visual*","represent*"]]},{"id":"w266","level":"hard","t":"I","q":"A measured height of 12 centimeters is which type of observation?","a":"Quantitative.","k":[["quantitative="]],"bad":["qualitative="]},{"id":"w267","level":"hard","t":"I","q":"How many meters are in 3 kilometers?","a":"3,000 m.","k":[["3 000","3000","3 thousand","three thousand"]]},{"id":"w268","level":"hard","t":"I","q":"How many minutes are in 2 hours?","a":"120 minutes.","k":[["120"]]},{"id":"w269","level":"easy","t":"CV","q":"What muscular organ pumps blood around the body?","a":"Heart.","k":[["heart"]]},{"id":"w270","level":"hard","t":"CV","q":"Which body system transports oxygen in the bloodstream?","a":"Circulatory system.","k":[["circulat*","cardiovascular","blood"]]},{"id":"w271","level":"hard","t":"HB","q":"What muscles and bones support and move the body together?","a":"Muscular and skeletal systems.","k":[["muscul*","muscle*"],["skelet*","bone*"]]},{"id":"w272","level":"hard","t":"DG","q":"What is the main function of the stomach during digestion?","a":"Mix and churn food with digestive juices.","k":[["mix*","churn*","digest*","break*","juice*","acid*"]]},{"id":"w273","level":"hard","t":"R","q":"What protects the opening of the windpipe while swallowing?","a":"Epiglottis.","k":[["epiglot*","epiglotis"]]},{"id":"w274","level":"easy","t":"G","q":"What term means animals with a backbone?","a":"Vertebrates.","k":[["vertebrate="]]},{"id":"w275","level":"hard","t":"G","q":"Is a spider an insect or an arachnid?","a":"Arachnid.","k":[["arachnid*"]],"bad":["insect"]},{"id":"w276","level":"hard","t":"EN","q":"What green structure in plant cells contains chlorophyll?","a":"Chloroplast.","k":[["chloroplast*"]]},{"id":"w277","level":"hard","t":"EN","q":"What gas do plants generally take in for photosynthesis?","a":"Carbon dioxide.","k":[["carbon dioxide","co2","co 2"]]},{"id":"w278","level":"easy","t":"EN","q":"What gas do plants release during photosynthesis?","a":"Oxygen.","k":[["oxygen"]]},{"id":"w279","level":"hard","t":"G","q":"What type of microorganism is yeast?","a":"Fungus.","k":[["fung*"]]},{"id":"w280","level":"easy","t":"L","q":"What life process allows a species to continue?","a":"Reproduction.","k":[["reproduc*"]]},{"id":"w281","level":"easy","t":"G","q":"Which class do bats belong to?","a":"Mammals.","k":[["mammal*"]]},{"id":"w282","level":"easy","t":"L","q":"What term means an animal giving birth to live young?","a":"Viviparous.","k":[["vivipar*"]]},{"id":"w283","level":"easy","t":"L","q":"What flower part produces pollen?","a":"Anther.","k":[["anther*"]]},{"id":"w284","level":"hard","t":"L","q":"What part of a seed begins developing into the young plant?","a":"Embryo.","k":[["embryo*"]]},{"id":"w285","level":"hard","t":"AD","q":"What adaptation lets a fish swim more efficiently through water?","a":"Streamlined body and fins.","k":[["streamline*","fin*","tail","shape*"]]},{"id":"w286","level":"hard","t":"AD","q":"A polar bear has thick fur and fat. These help with what?","a":"Insulation against cold.","k":[["insulat*","cold","warm*","heat","freez*"]]},{"id":"w287","level":"easy","t":"AD","q":"A camel survives dry places partly by conserving what resource?","a":"Water.","k":[["water"]]},{"id":"w288","level":"hard","t":"AD","q":"What type of adaptation is migration: structural or behavioral?","a":"Behavioral.","k":[["behavior*","behaviour*"]],"bad":["structural"]},{"id":"w289","level":"hard","t":"F","q":"What happens to motion when forces become unbalanced?","a":"Speed or direction changes (acceleration).","k":[["speed","direction","change*","accelerat*","move*","start*","stop*"]]},{"id":"w290","level":"easy","t":"E","q":"What noncontact force acts between magnets?","a":"Magnetic force.","k":[["magnetic","magnetism","magnet*"]]},{"id":"w291","level":"hard","t":"F","q":"What contact force acts against movement through air?","a":"Air resistance (drag).","k":[["air resistance","drag","resistance","friction"]]},{"id":"w292","level":"easy","t":"F","q":"Does a rougher surface normally increase or decrease friction?","a":"Increase.","k":[["increas*","more","greater","higher"]],"bad":["decreas*","less","reduc*","lower"]},{"id":"w293","level":"easy","t":"F","q":"Can gravity pull between two objects that are not touching?","a":"Yes.","k":[["yes","yeah","can","true","sure"]]},{"id":"w294","level":"hard","t":"E","q":"What is the electrical term for a sudden transfer of built-up charge?","a":"Discharge.","k":[["discharg*","spark*"]]},{"id":"w295","level":"easy","t":"E","q":"What charge does an electron have?","a":"Negative.","k":[["negative="]],"bad":["positive="]},{"id":"w296","level":"hard","t":"E","q":"What kind of circuit has more than one branch for current?","a":"Parallel circuit.","k":[["parallel"]]},{"id":"w297","level":"hard","t":"E","q":"Why should hands be dry when using electrical devices?","a":"To reduce the risk of electric shock.","k":[["shock*","electrocut*","safe*","water","danger*","conduct*","burn*"]]},{"id":"w298","level":"hard","t":"E","q":"Which magnetic poles attract: like poles or unlike poles?","a":"Unlike poles.","k":[["unlike","opposite*","different*"]]},{"id":"w299","level":"hard","t":"E","q":"What is the iron center of many electromagnets called?","a":"Core.","k":[["core*"]]},{"id":"w300","level":"hard","t":"E","q":"What happens to an electromagnet when no current flows?","a":"Its magnetism stops or becomes much weaker.","k":[["stop*","weak*","off","lose*","nothing","no magnet*","not magnet*","demagnet*","disappear*"]],"neg":1},{"id":"b1","level":"easy","t":"HB","q":"What is the body's largest organ?","a":"Skin","k":[["skin"]],"x":"The skin covers the whole body and is the largest organ. It protects us and helps control body temperature."},{"id":"b2","level":"easy","t":"HB","q":"What is the average human body temperature?","a":"37°C (98.6°F)","k":[["37","98.6","thirty seven"]],"x":"Normal body temperature is about 37 degrees Celsius, which is 98.6 degrees Fahrenheit."},{"id":"b3","level":"hard","t":"HB","q":"How many bones are in the adult human body?","a":"206 bones","k":[["206"]],"x":"An adult skeleton has 206 bones. Babies are born with more, and some bones join together as they grow."},{"id":"b4","level":"easy","t":"HB","q":"What mineral do bones need to grow strong?","a":"Calcium","k":[["calcium"]],"x":"Calcium makes bones and teeth hard and strong. Milk, cheese and small fish eaten with their bones are good sources."},{"id":"b5","level":"easy","t":"CV","q":"Which blood cells carry oxygen?","a":"Red blood cells","k":[["red blood cell","red cell","erythrocyte","red blood"]],"x":"Red blood cells carry oxygen from the lungs to every part of the body."},{"id":"b6","level":"easy","t":"HB","q":"Which organ is the control center of the human body?","a":"Brain","k":[["brain"]],"x":"The brain sends and receives messages that control thinking, movement and feeling."},{"id":"b7","level":"easy","t":"HB","q":"True or False: The brain is a muscle.","a":"False","k":[["false","incorrect","untrue","not true","wrong","no"]],"neg":1,"x":"The brain is made of nerve cells and other tissue, not muscle. Muscles are what let us move."},{"id":"b8","level":"hard","t":"HB","q":"What do the letters IQ stand for?","a":"Intelligence Quotient","k":[["intelligence"],["quotient"]],"x":"IQ stands for Intelligence Quotient. It is a score that comes from a type of test."},{"id":"b9","level":"easy","t":"DG","q":"How many teeth does an adult human usually have?","a":"32 teeth","k":[["32"]],"x":"An adult usually has 32 teeth, including the wisdom teeth. Children have 20 baby teeth."},{"id":"b10","level":"easy","t":"DG","q":"Which teeth are used for cutting and biting food?","a":"Incisors","k":[["incisor*","incisior*"]],"x":"Incisors are the sharp, flat front teeth that cut and bite food."},{"id":"b11","level":"easy","t":"HB","q":"What is the smallest unit of life?","a":"Cell","k":[["cell*"]],"x":"The cell is the smallest unit of life. Every living thing is made of one or more cells."},{"id":"b12","level":"easy","t":"DG","q":"Which organ is responsible for processing nutrients, producing bile, and detoxifying certain substances?","a":"Liver","k":[["liver"]],"x":"The liver processes nutrients, makes bile and helps remove harmful substances from the blood."},{"id":"b13","level":"hard","t":"DG","q":"What substance can cause serious damage to the liver when consumed excessively?","a":"Alcohol","k":[["alcohol"]],"x":"Too much alcohol can scar and damage the liver, because the liver has to filter it out of the blood."},{"id":"b14","level":"easy","t":"HB","q":"Which of these is not one of the five traditional human senses? Choices: sight, sleep, hearing, or touch.","a":"Sleep","k":[["sleep"]],"x":"Our five senses are sight, hearing, smell, taste and touch. Sleep is not a sense."},{"id":"b15","level":"easy","t":"HB","q":"Which of these is not one of the basic tastes? Choices: sweet, spicy, salty, or bitter.","a":"Spicy", let actx=null;
function tone(freqs,dur){
  if(settings.mute||!settings.sfx)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    let t=actx.currentTime;
    freqs.forEach(f=>{const o=actx.createOscillator(),g=actx.createGain();o.type="triangle";o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.18*settings.volume,t+.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur+.02);t+=dur*.8;});
  }catch(e){}
}

/* ===================== Text to speech ===================== */
const ttsOK="speechSynthesis" in window&&"SpeechSynthesisUtterance" in window;
let voiceCache=null,speakFin=null,speakTimer=null;
function pickVoice(){
  if(!ttsOK)return null;
  const vs=speechSynthesis.getVoices();if(!vs.length)return voiceCache;
  const en=vs.filter(v=>/^en(-|_)/i.test(v.lang)||/^en$/i.test(v.lang));
  const pref=["Google US English","Samantha","Microsoft Aria","Microsoft Jenny","Microsoft Zira","Karen","Moira","Google UK English Female"];
  for(const p of pref){const v=en.find(x=>x.name.indexOf(p)>=0);if(v){voiceCache=v;return v;}}
  voiceCache=en.find(v=>/US/i.test(v.lang))||en[0]||null;return voiceCache;
}
if(ttsOK){try{speechSynthesis.onvoiceschanged=()=>{voiceCache=null;pickVoice();};}catch(e){}}
function cancelSpeech(){
  if(speakFin){const f=speakFin;speakFin=null;try{speechSynthesis.cancel();}catch(e){}f();}
  else if(ttsOK){try{speechSynthesis.cancel();}catch(e){}}
}
function speak(text){
  return new Promise(res=>{
    cancelSpeech();
    text=speakable(text);
    if(settings.mute||!ttsOK||!text){res();return;}
    const u=new SpeechSynthesisUtterance(text);
    u.rate=settings.rate;u.volume=settings.volume;u.pitch=1.12;u.lang="en-US";
    const v=pickVoice();if(v)u.voice=v;
    let done=false;
    const fin=()=>{if(done)return;done=true;clearTimeout(speakTimer);if(speakFin===fin)speakFin=null;res();};
    u.onend=fin;u.onerror=fin;speakFin=fin;
    speakTimer=setTimeout(fin,Math.max(4000,text.length*90/Math.max(.5,settings.rate)+2500));
    try{speechSynthesis.speak(u);}catch(e){fin();}
  });
}

/* ===================== Speech recognition ===================== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const micOK=!!SR;
const Mic={rec:null,gen:0,
  start(cb){
    this.stop();
    if(!SR){cb.error("unsupported");return;}
    const gen=++this.gen;let got=false,err=null;
    const r=new SR();
    r.lang="en-US";r.interimResults=true;r.continuous=false;r.maxAlternatives=3;
    r.onresult=e=>{
      if(gen!==this.gen)return;
      let interim="",fin=null;
      for(let i=e.resultIndex;i<e.results.length;i++){
        const res=e.results[i];
        if(res.isFinal){fin=[];for(let j=0;j<res.length;j++){const t=(res[j].transcript||"").trim();if(t)fin.push(t);}}
        else interim+=res[0].transcript;
      }
      if(fin&&fin.length){got=true;cb.final(fin);}else if(interim)cb.interim(interim.trim());
    };
    r.onerror=e=>{if(gen!==this.gen)return;err=e.error;cb.error(e.error);};
    r.onend=()=>{if(gen!==this.gen)return;cb.end(got,err);};
    this.rec=r;
    try{r.start();}catch(e){cb.error("start-failed");}
  },
  stop(){
    this.gen++;const r=this.rec;this.rec=null;
    if(r){r.onresult=r.onerror=r.onend=null;try{r.abort();}catch(e){}}
  }
};
function micErrorText(code){

    case"network":return"The browser’s speech service can’t be reached (it needs an internet connection). You can type your answer instead.";
    case"unsupported":return"This browser can’t turn speech into text. Use Google Chrome or Microsoft Edge for voice answers, or type your answers.";
    case"language-not-supported":return"English speech recognition isn’t available in this browser. You can type your answers.";
    default:return"The microphone had a problem ("+code+"). Try the mic button again or type your answer.";
  }
}

const Timer={id:null,rem:0,tot:0,endAt:0,onTick:null,onEnd:null,
  start(ms,onTick,onEnd){this.clear();this.tot=this.rem=ms;this.onTick=onTick;this.onEnd=onEnd;this.run();},
  run(){this.endAt=Date.now()+this.rem;clearInterval(this.id);this.id=setInterval(()=>{
    this.rem=Math.max(0,this.endAt-Date.now());if(this.onTick)this.onTick(this.rem,this.tot);
    if(this.rem<=0){const f=this.onEnd;this.clear();if(f)f();}},100);},
  pause(){if(this.id){clearInterval(this.id);this.id=null;this.rem=Math.max(0,this.endAt-Date.now());}},
  resume(){if(!this.id&&this.rem>0&&this.onEnd)this.run();},
  clear(){clearInterval(this.id);this.id=null;this.onEnd=null;this.onTick=null;this.rem=0;this.tot=0;}
};

/* ===================== Quiz engine ===================== */
function pickFresh(list,n){
  const seen=store.get("seen",{});
  let pick=shuffle(list.filter(q=>!seen[q.id])).slice(0,n);
  if(pick.length<n){
    list.forEach(q=>{delete seen[q.id];});
    pick=pick.concat(shuffle(list.filter(q=>pick.indexOf(q)<0)).slice(0,n-pick.length));
  }
  pick.forEach(q=>{seen[q.id]=1;});
  store.set("seen",seen);
  return shuffle(pick);
}
function buildQuestions(mode,level,n){
  let pool=allQuestions();
  if(mode==="mistakes"){pool=pool.filter(q=>stats.missed[q.id]);return shuffle(pool).slice(0,n);}
  pool=pool.filter(q=>inFilter(q,settings.filter));
  if(level==="all"){
    const per=Math.ceil(n/3);let out=[];
    for(const lv of ["easy","hard","advanced"])out=out.concat(pickFresh(pool.filter(q=>q.level===lv),per));
    return out;
  }
  return pickFresh(pool.filter(q=>q.level===level),n);
}
function startQuiz(mode){

  if(!qs.length){toastMsg=mode==="mistakes"?"You have no missed questions to practice yet. Play a quiz first!":"No questions match that level and topic. Try “All topics” or a different level.";go("home");return;}
  cleanup();
  quiz={mode,level:settings.level,qs,i:-1,score:0,correct:0,wrong:0,answers:[],state:"IDLE",dead:false,timeouts:[],
    micOn:false,micStatus:micOK?"idle":"unsupported",typed:!micOK,micMsg:micOK?"":micErrorText("unsupported"),lastLevel:null,heard:"",interim:"",hostText:"",q:null,fb:null,unsure:0,trouble:false,
    timed:false,names:null};

}

  let intro="";
  if(me.i===0)intro+="Hello "+settings.name+"! Welcome to Science Wonder Quiz Bee! ";
  if(q.level!==me.lastLevel){intro+=L.name+" round: "+L.title+"! ";me.lastLevel=q.level;}
  const text=intro+"Question number "+ordWord(me.i+1)+"! "+speakable(q.q);
  me.hostText="Question "+(me.i+1)+"! "+speakable(q.q);
  ui();
  await speak(text);if(!alive(me))return;
  await wait(me,450);if(!alive(me))return;
  beginAnswering(me,true);
}
function beginAnswering(me,fresh){
  if(!alive(me))return;
  if(fresh&&me.timed){
    Timer.start(me.timeTotal,()=>ui(),()=>timeUp(me));
  }else if(me.timed){Timer.resume();}
  startListen(me);
}
function startListen(me){
  if(!alive(me))return;
  setState("LISTENING");me.interim="";
  if(!micOK||me.micStatus==="denied"||me.micStatus==="nomic"||me.micStatus==="network"){me.micOn=false;me.typed=true;ui();return;}
  if(!settings.autoListen&&!me.userTapped){me.micOn=false;ui();return;}
  me.micOn=true;me.emptyRounds=me.emptyRounds||0;ui();
  Mic.start({
    interim:t=>{if(alive(me)&&me.state==="LISTENING"){me.interim=t;ui();}},
    final:alts=>{if(alive(me)&&me.state==="LISTENING")onHeard(me,alts);},
    error:code=>{
      if(!alive(me))return;
      if(code==="no-speech"||code==="aborted")return;
      me.micOn=false;me.typed=true;
      if(code==="not-allowed"||code==="service-not-allowed")me.micStatus="denied";
      else if(code==="audio-capture")me.micStatus="nomic";
      else if(code==="network"||code==="unsupported"||code==="language-not-supported")me.micStatus="network";
      me.micMsg=micErrorText(code);ui();
    },
    end:(got,err)=>{
      if(!alive(me)||me.state!=="LISTENING"||got||!me.micOn)return;
      if(err&&err!=="no-speech"&&err!=="aborted")return;
      me.emptyRounds++;
      if(!me.timed&&me.emptyRounds>=4){me.micOn=false;me.emptyRounds=0;ui();return;}
      wait(me,250).then(()=>{if(alive(me)&&me.state==="LISTENING"&&me.micOn)startListen(me);});
    }
  });
  me.micStatus=me.micStatus==="idle"?"ok":me.micStatus;
}
function stopListening(me){Mic.stop();if(me)me.micOn=false;}
function onHeard(me,alts){
  stopListening(me);me.heard=alts[0];me.interim="";me.emptyRounds=0;
  const cmd=parseCommand(alts[0]);
  if(cmd){runCommand(me,cmd);return;}
  submit(me,alts,"voice");
}
function submit(me,alts,src){
  if(!alive(me)||me.state==="FEEDBACK"||me.state==="PROCESSING")return;
  stopListening(me);Timer.pause();
  me.heard=alts[0];me.src=src;setState("PROCESSING");ui();
  const q=me.q;let res=judge(q,alts);
  if(me.retrying){feedback(me,res==="correct"?"correct":"wrong");return;}
  if(res==="idk"&&me.mode==="competition")res="wrong";
  if(res==="unsure"||res==="idk"){reprompt(me,res);return;}
  if(res==="partial"&&(me.mode==="practice"||me.mode==="mistakes")&&!me.partialUsed){me.partialUsed=true;reprompt(me,"partial");return;}
  feedback(me,res==="correct"?"correct":"wrong");
}
async function reprompt(me,kind){
  let msg;
  if(kind==="partial")msg="You’re on the right track! Can you say the whole answer?";
  else if(kind==="idk")msg="That’s okay! Say hint for a clue, or try your best guess!";
  else{me.unsure++;me.trouble=true;msg=me.unsure>=2?"I’m having trouble hearing you. Tap the microphone, or type your answer.":"Hmm, I didn’t catch that. Please say your answer again!";if(me.unsure>=2)me.typed=true;}
  me.hostText=msg;me.heard=kind==="unsure"?"":me.heard;setState("SPEAKING");ui();
  await speak(msg);if(!alive(me))return;
  await wait(me,300);if(!alive(me))return;
  me.heard="";me.userTapped=true;beginAnswering(me,false);
}
async function runCommand(me,cmd){
  Timer.pause();setState("PROCESSING");ui();
  const prac=me.mode==="practice"||me.mode==="mistakes";
  if(cmd==="repeat"){await replay(me);return;}
  if(cmd==="score"){
    const n=me.answers.filter(a=>!a.unscored).length;
    const msg="You have "+me.score+" point"+(me.score===1?"":"s")+". You got "+me.correct+" of "+n+" questions right so far.";
    me.hostText=msg;setState("SPEAKING");ui();await speak(msg);if(!alive(me))return;await wait(me,300);if(!alive(me))return;me.heard="";beginAnswering(me,false);return;
  }
  if(cmd==="hint"){if(prac){await giveHint(me);}else{me.hostText="No hints in the competition!";setState("SPEAKING");ui();await speak(me.hostText);if(!alive(me))return;me.heard="";beginAnswering(me,false);}return;}
  if(cmd==="stop"){me.heard="";endEarly(me);return;}
  if(cmd==="next"||cmd==="skip"){skip(me);return;}
}
async function replay(me){
  if(!alive(me))return;
  stopListening(me);Timer.pause();setState("SPEAKING");me.heard="";me.hostText=speakable(me.q.q);ui();
  await speak(me.q.q);if(!alive(me))return;
  await wait(me,350);if(!alive(me))return;
  me.userTapped=true;beginAnswering(me,false);
}
function hintFor(q){
  const w=q.a.replace(/[^A-Za-z0-9 ]/g," ").trim().split(/\s+/);
  if(w.length<=3&&/[A-Za-z]/.test(w[0]))return "Here’s a hint. The answer starts with the letter "+w[0][0].toUpperCase()+".";
  if(/^\d/.test(q.a))return "Here’s a hint. Look closely at the numbers in the problem and do the math step by step.";
  return "Here’s a hint. Think about "+topicName(q.t)+".";
}
async function giveHint(me){
  stopListening(me);Timer.pause();setState("SPEAKING");const h=hintFor(me.q);me.hostText=h;me.heard="";ui();
  await speak(h);if(!alive(me))return;await wait(me,300);if(!alive(me))return;me.userTapped=true;beginAnswering(me,false);
}
function skip(me){
  if(!alive(me))return;stopListening(me);Timer.pause();me.heard=me.heard||"";feedback(me,"skipped");
}
function timeUp(me){
  if(!alive(me)||me.state==="FEEDBACK")return;
  stopListening(me);cancelSpeech();feedback(me,"timeout");
}
async function feedback(me,kind){
  if(!alive(me))return;
  stopListening(me);Timer.clear();
  const q=me.q,L=LEVELS[q.level];
  const ok=kind==="correct";
  const unscored=kind==="timeout"&&(me.trouble||me.micStatus==="denied"||me.micStatus==="nomic");
  setState("FEEDBACK");
  let spoken,msg="";
  if(ok){
    if(!me.retrying){me.score+=L.pts;me.correct++;}
    const long=q.a.split(/\s+/).length>5;
    msg=me.retrying?" Nice job trying again!":" You earned "+L.pts+" point"+(L.pts>1?"s":"")+"!";
    spoken=praise()+" "+(me.retrying?"That’s it!":(q.a.split(/\s+/).length<=4?q.a.replace(/\.$/,"")+" is correct! ":"")+"You earned "+L.pts+" point"+(L.pts>1?"s":"")+"!")+((me.mode==="practice"||me.mode==="mistakes")&&long&&!q.x?" Here’s the explanation: "+q.a:"");
    sfx.ok();
  }else if(kind==="timeout"){
    spoken="Time is up! Let’s find out the correct answer. "+q.a;sfx.bad();
  }else if(kind==="skipped"){
    spoken="Okay, let’s skip that one! The correct answer is "+q.a;
  }else{
    spoken=tryAgain()+" The correct answer is "+q.a+".";sfx.bad();
  }
  const pracM=me.mode==="practice"||me.mode==="mistakes";
  if(q.x&&(pracM||/^True or False/.test(q.q)))spoken+=" Here is why: "+q.x;
  if(kind==="wrong"&&pracM)spoken+=" Want to try again?";
  if(!me.retrying){
    if(!ok&&!unscored)me.wrong++;
    me.answers.push({id:q.id,q:q.q,a:q.a,x:q.x||"",t:q.t,level:q.level,said:me.heard||"",src:me.src||"voice",res:kind,unscored});
  }
  me.fb={kind,msg};me.fbKey=me.i+":"+kind+":"+(me.retrying?"r":"f")+":"+Date.now();me.hostText=ok?spoken:spoken;
  const prac=me.mode==="practice"||me.mode==="mistakes";
  me.waitNext=prac;
  live((ok?"Correct. ":"Not quite. ")+"The answer is "+q.a);
  ui();
  await speak(spoken);if(!alive(me))return;
  if(prac){me.hostText="Press Next question when you’re ready.";ui();return;}
  await wait(me,ok?600:900);if(!alive(me))return;
  askQuestion();
}
function retryQuestion(){
  const me=quiz;if(!me||!me.waitNext)return;
  me.retrying=true;me.waitNext=false;me.fb=null;me.fbKey="";me.heard="";me.userTapped=true;
  me.hostText="Try again! "+speakable(me.q.q);setState("LISTENING");ui();
  beginAnswering(me,false);
}
function endEarly(me){
  if(!alive(me))return;
  cancelSpeech();Timer.clear();stopListening(me);
  if(!me.answers.length){go("home");return;}
  finish(true);
}
function finish(early){
  const me=quiz;if(!me)return;
  Timer.clear();Mic.stop();cancelSpeech();
  const scored=me.answers.filter(a=>!a.unscored);
  const correct=scored.filter(a=>a.res==="correct").length;
  const pct=scored.length?correct/scored.length:0;
  const name=settings.name;
  let tail=pct>=.9?" You are a true Science Champion!":pct>=.7?" Great job, scientist!":pct>=.4?" Nice work! Keep practicing and you will be a champion.":" Every scientist learns by trying. Let’s practice the ones you missed!";
  const message=(early?"You stopped early, "+name+". ":"Congratulations "+name+"! You completed the Science Quiz Bee and ")+(early?"You answered ":"answered ")+correct+" out of "+scored.length+" question"+(scored.length===1?"":"s")+" correctly!"+tail;
  const session={date:Date.now(),name,mode:me.mode,level:me.level,points:me.score,correct,scored:scored.length,answers:me.answers,message};
  // stats
  scored.forEach(a=>{
    const t=stats.topics[a.t]||(stats.topics[a.t]={c:0,t:0});t.t++;if(a.res==="correct")t.c++;
    if(a.res==="correct")delete stats.missed[a.id];else stats.missed[a.id]=(stats.missed[a.id]||0)+1;
  });
  session.newBadges=awardBadges(session);
  const keep=Object.assign({},session,{answers:session.answers.map(a=>({id:a.id,t:a.t,level:a.level,res:a.res,said:a.said}))});
  stats.sessions.unshift(keep);stats.sessions=stats.sessions.slice(0,50);saveStats();
  lastSession=session;
  quiz.dead=true;quiz=null;view="results";render();window.scrollTo(0,0);
  sfx.win();
  speak(message);
}

/* ===================== Confetti ===================== */
let confettiRAF=null;
function startConfetti(){
  const c=$("#confetti");if(!c)return;
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const ctx=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=["#3b6cf6","#7c4dff","#27d3a2","#ffc533","#e8532f"];
  const ps=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.6,r:4+Math.random()*6,c:cols[rnd(cols.length)],vy:2+Math.random()*3.5,vx:-1.5+Math.random()*3,rot:Math.random()*6}));
  const end=Date.now()+3500;cancelAnimationFrame(confettiRAF);
  (function f(){
    ctx.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.rot+=.1;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore();});
    if(Date.now()<end&&view==="results")confettiRAF=requestAnimationFrame(f);else ctx.clearRect(0,0,c.width,c.height);
  })();
}

/* ===================== Microphone test ===================== */
function mtRefresh(){if(view==="mictest"){app.innerHTML=micTestView();}}
function micTestStart(){
  mtState.error=null;mtState.ok=false;mtState.heard="";mtState.listening=true;mtState.status="Listening… say “hello science”.";
  cancelSpeech();mtRefresh();
  Mic.start({
    interim:t=>{mtState.heard=t;const e=$("#mtHeard");if(e)e.textContent="I heard: “"+t+"”";},
    final:alts=>{Mic.stop();mtState.listening=false;mtState.heard=alts[0];mtState.ok=true;mtState.status="Great! I heard you.";micTestedThisVisit=true;mtRefresh();speak("I heard you say "+alts[0]);},
    error:code=>{if(code==="no-speech"||code==="aborted")return;Mic.stop();mtState.listening=false;mtState.error=code;mtState.status="";mtRefresh();},
    end:(got,err)=>{if(!got&&!err&&mtState.listening){mtState.listening=false;mtState.status="I didn’t hear anything. Press the button and try again.";mtRefresh();}}
  });
}

/* ===================== Events ===================== */
app.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.tagName==="SELECT"||b.type==="range"||b.type==="checkbox")return;
  act(b.dataset.act,b);
});
app.addEventListener("change",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  if(b.dataset.act==="filter"){settings.filter=b.value;saveSettings();return;}
  if(b.dataset.act==="set"){
    const k=b.dataset.k;let v=b.type==="checkbox"?b.checked:b.type==="range"?parseFloat(b.value):(["numQ"].includes(k)?parseInt(b.value,10):b.value);
    settings[k]=v;saveSettings();
  }
});
app.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="nm"){settings.name=t.value.trim().slice(0,20);saveSettings();}
  if(t.dataset&&t.dataset.act==="set"&&t.type==="range"){
    const k=t.dataset.k;settings[k]=parseFloat(t.value);saveSettings();
    const vv=$("#vVal"),rv=$("#rVal");if(vv)vv.textContent=Math.round(settings.volume*100)+"%";if(rv)rv.textContent=settings.rate.toFixed(2)+"×";
  }
});
app.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id==="typeIn"){e.preventDefault();typedSubmit();}
});
function typedSubmit(){
  const me=quiz;if(!me)return;const el=$("#typeIn");const v=el?el.value.trim():"";if(!v)return;
  if(me.state!=="LISTENING")return;
  el.value="";const cmd=parseCommand(v);
  if(cmd&&cmd!=="hint"){runCommand(me,cmd);return;}
  submit(me,[v],"typed");
}
function act(a,b){
  const me=quiz;
  switch(a){
    case"home":go("home");break;
    case"level":settings.level=b.dataset.v;saveSettings();render();break;
    case"hello":speak("Welcome to Science Wonder Quiz Bee! Are you ready to become a Science Champion?");{const m=$("#homeMascot");if(m)m.className="mascot speaking";setTimeout(()=>{const x=$("#homeMascot");if(x)x.className="mascot";},3500);}break;
    case"start":{
      const mode=b.dataset.v;
      if(micOK&&settings.autoListen&&!micTestedThisVisit&&mode!=="practice"&&view!=="review"){pendingStart=mode;go("mictest");break;}
      startQuiz(mode);break;}
    case"mictest":pendingStart=null;go("mictest");break;
    case"mt-voice":speak("Hello! I am your science quiz host. Can you hear me?");break;
    case"mt-mic":if(mtState.listening){Mic.stop();mtState.listening=false;mtState.status="Stopped.";mtRefresh();}else micTestStart();break;
    case"mt-go":{const m=pendingStart;pendingStart=null;micTestedThisVisit=true;Mic.stop();startQuiz(m);break;}
    case"progress":go("progress");break;
    case"sound":go("sound");break;
    case"parent":go("parent");syncParentSelects();break;
    case"test-voice":speak("Hi! I am your science quiz host. This is how I sound.");break;
    case"results":go("results");break;
    case"review":go("review");break;
    case"again":startQuiz(lastSession?lastSession.mode:"practice");break;
    case"replay-item":{const it=lastSession.answers[+b.dataset.v];speak(it.q+" The correct answer is "+it.a);break;}
    case"add-custom":{
      const q=$("#c-q").value.trim(),k=$("#c-k").value.trim(),ans=$("#c-a").value.trim()||$("#c-k").value.split(",")[0].trim();
      const msg=$("#c-msg");
      if(!q||!k){msg.textContent="Please fill in the question and at least one accepted answer.";break;}
      const alts=k.split(",").map(s=>s.trim()).filter(Boolean);
      custom.push({id:"c"+Date.now(),level:$("#c-l").value,t:$("#c-t").value,q,a:ans,accept:alts.join(", "),k:[alts.map(s=>s.replace(/\|/g," "))],custom:true});
      store.set("custom",custom);go("parent");syncParentSelects();break;}
    case"del-custom":custom.splice(+b.dataset.v,1);store.set("custom",custom);go("parent");syncParentSelects();break;
    case"reset":
      if(b.dataset.armed){stats={sessions:[],missed:{},topics:{},badges:{}};saveStats();go("parent");syncParentSelects();}
      else{b.dataset.armed="1";b.textContent="Tap again to erase everything";setTimeout(()=>{if(b&&b.isConnected){delete b.dataset.armed;b.textContent="Erase all progress";}},4000);}
      break;
    /* quiz */
    case"q-exit":
      if(b.dataset.armed){go("home");}
      else{b.dataset.armed="1";b.textContent="Tap again to exit";setTimeout(()=>{if(b&&b.isConnected){delete b.dataset.armed;b.textContent="✕ Exit";}},3000);}
      break;
    case"q-mute":settings.mute=!settings.mute;saveSettings();if(settings.mute)cancelSpeech();ui();break;
    case"q-mic":
      if(!me||me.state!=="LISTENING")break;
      if(me.micOn){stopListening(me);ui();}
      else{me.userTapped=true;me.micMsg="";if(me.micStatus==="denied"||me.micStatus==="nomic"||me.micStatus==="network")me.micStatus="idle";sfx.mic();startListen(me);}
      break;
    case"q-replay":if(me&&!me.fb)replay(me);break;
    case"q-hint":if(me&&me.state==="LISTENING")giveHint(me);break;
    case"q-skip":if(me&&me.state!=="FEEDBACK"&&me.state!=="PROCESSING")skip(me);break;
    case"q-type":if(me){me.typed=!me.typed;ui();if(me.typed){const i=$("#typeIn");if(i)i.focus();}}break;
    case"q-submit":typedSubmit();break;
    case"q-next":if(me&&me.waitNext){cancelSpeech();askQuestion();}break;
    case"q-retry":retryQuestion();break;
  }
}
/* keep the timer ring and mic UI fresh */
addEventListener("pagehide",cleanup);
document.addEventListener("visibilitychange",()=>{if(document.hidden&&quiz&&quiz.state==="LISTENING"){/* browsers stop mic in background; user can tap again */}});
render();
</script>
